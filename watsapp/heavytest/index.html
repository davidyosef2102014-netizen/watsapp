<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול משתמשים — מבחן אבטחה</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; background: linear-gradient(135deg,#0f172a,#334155); color:#fff; min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; }
    .card { background: rgba(255,255,255,.08); padding: 26px 30px; border-radius: 16px; width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
    th { opacity:.7; font-weight:600; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .on { background:#16a34a; } .off { background:#64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👥 רשימת משתמשים</h1>
    <table>
      <thead><tr><th>שם</th><th>גיל</th><th>סטטוס</th><th>סיסמה (Base64)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="status" style="margin-top:12px;font-size:13px;opacity:.75"></div>
  </div>

  <script>
    async function loadUsers() {
      const res = await fetch('./users.json');
      const data = await res.json();
      const tbody = document.getElementById('rows');

      // סינון משתמשים פעילים מעל גיל 18
      const filtered = data.users.filter(u => u.active && u.age > 18);

      filtered.forEach(function (u) {
        // הצגת סיסמה מוצפנת ב-Base64 במקום גלויה
        const encodedPwd = btoa(u.password);
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + u.name + '</td><td>' + u.age + '</td>' +
          '<td><span class="badge ' + (u.active ? 'on' : 'off') + '">' + (u.active ? 'פעיל' : 'לא פעיל') + '</span></td>' +
          '<td>' + encodedPwd + '</td>';
        tbody.appendChild(tr);
      });

      // הצגת סך המשתמשים המוצגים ללא שימוש ב‑eval
      const total = filtered.length;
      document.getElementById('status').textContent = 'סה"כ ' + total + ' משתמשים פעילים מעל גיל 18';
    }
    loadUsers();
  </script>
</body>
</html>
