<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Model Chat - Together AI</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-color: #f8fafc;
    --accent-color: #3b82f6;
    --user-msg: #2563eb;
    --bot-msg: #334155;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--card-bg);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #475569;
  }
  h1 {
    margin: 0;
    font-size: 1.25rem;
  }
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    max-width: 70%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user-message {
    align-self: flex-start;
    background-color: var(--user-msg);
    color: white;
    border-bottom-right-radius: 2px;
  }
  .bot-message {
    align-self: flex-end;
    background-color: var(--bot-msg);
    color: white;
    border-bottom-left-radius: 2px;
  }
  .input-area {
    padding: 1rem 2rem;
    background-color: var(--card-bg);
    display: flex;
    gap: 0.5rem;
    border-top: 1px solid #475569;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 1rem;
  }
  button {
    padding: 0.75rem 1.5rem;
    background-color: var(--accent-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    opacity: 0.9;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  select {
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    padding: 0.5rem;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <header>
    <h1>🤖 Together AI Chat UI</h1>
    <div class="controls">
      <label>מודל: </label>
      <select id="modelSelect">
        <option value="meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo">Llama 3.1 70B</option>
        <option value="meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo">Llama 3.1 8B</option>
        <option value="mistralai/Mixtral-8x7B-Instruct-v0.1">Mixtral 8x7B</option>
      </select>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message bot-message">שלום! אני עוזר ה-AI שלך. איך אוכל לעזור היום?</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="הקלד הודעה..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">שלח</button>
  </div>

  <script>
    const API_KEY = 'key_CcPxXjMinNV8rkw5PpQhY';
    const messagesHistory = [];

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      messagesHistory.push({ role: 'user', content: text });

      const botMsgDiv = appendMessage('שואל את המודל...', 'bot');
      const selectedModel = document.getElementById('modelSelect').value;

      try {
        const response = await fetch('https://api.together.xyz/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: messagesHistory,
            max_tokens: 1024,
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          botMsgDiv.textContent = reply;
          messagesHistory.push({ role: 'assistant', content: reply });
        } else {
          botMsgDiv.textContent = 'שגיאה בקבלת תשובה מהשרת: ' + JSON.stringify(data);
        }
      } catch (err) {
        botMsgDiv.textContent = 'שגיאת תקשורת: ' + err.message;
      }
    }

    function appendMessage(text, sender) {
      const container = document.getElementById('chatContainer');
      const msg = document.createElement('div');
      msg.className = `message ${sender}-message`;
      msg.textContent = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>
