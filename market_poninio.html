<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSHOP</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pri:   #e43d2f;
  --pri2:  #ff6900;
  --gold:  #f5a623;
  --bg:    #f5f5f5;
  --card:  #ffffff;
  --border:#e8e8e8;
  --text:  #17181c;
  --muted: #888;
  --green: #19a74d;
  --r8:    8px;
  --r12:   12px;
  --sh:    0 2px 8px rgba(0,0,0,.08);
  --sh2:   0 6px 24px rgba(0,0,0,.13);
}

body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); direction: rtl; min-height:100vh; }

/* ── HEADER ── */
#app-header {
  background: linear-gradient(135deg, var(--pri) 0%, var(--pri2) 100%);
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 12px rgba(228,61,47,.4);
}
.header-top {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; max-width: 1280px; margin: 0 auto;
}
.logo {
  font-size: 1.6rem; font-weight: 900; color: #fff;
  letter-spacing: -1px; white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,.25);
  flex-shrink: 0;
}
.logo span { color: #ffd966; }
.search-wrap { flex: 1; display: flex; max-width: 560px; }
#search-input {
  flex: 1; padding: 10px 16px;
  border: none; border-radius: 24px 0 0 24px;
  font-size: .95rem; outline: none;
  background: #fff; color: var(--text);
}
.search-btn {
  background: var(--gold); color: #fff; border: none;
  padding: 10px 20px; border-radius: 0 24px 24px 0;
  cursor: pointer; font-size: 1rem; font-weight: 700;
  transition: background .2s;
}
.search-btn:hover { background: #e09400; }
.header-actions { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.icon-btn {
  background: rgba(255,255,255,.18); border: none; cursor: pointer;
  font-size: 1.2rem; position: relative; padding: 7px 10px;
  border-radius: 20px; color: #fff; white-space: nowrap;
  font-weight: 600; font-size: .85rem; transition: background .2s;
}
.icon-btn:hover { background: rgba(255,255,255,.3); }
.cart-badge {
  position: absolute; top: -2px; left: -2px;
  background: var(--gold); color: #fff;
  font-size: .62rem; font-weight: 800; border-radius: 50%;
  width: 16px; height: 16px;
  display: none; align-items: center; justify-content: center;
}
.conn-pill {
  font-size: .7rem; padding: 3px 10px; border-radius: 20px;
  font-weight: 700; white-space: nowrap; border: 1.5px solid transparent;
}
.conn-pill.connected    { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
.conn-pill.connecting   { background: #fef9c3; color: #78350f; border-color: #fde68a; }
.conn-pill.disconnected { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
.user-pill {
  font-size: .8rem; padding: 6px 14px;
  background: rgba(255,255,255,.22); color: #fff;
  border-radius: 20px; cursor: pointer;
  white-space: nowrap; border: 1.5px solid rgba(255,255,255,.4);
  font-weight: 700; transition: background .2s;
}
.user-pill:hover { background: rgba(255,255,255,.35); }
.user-pill.logout { background: rgba(0,0,0,.25); }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex; max-width: 1280px; margin: 0 auto;
  border-top: 1px solid rgba(255,255,255,.2); overflow-x: auto;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 9px 20px; cursor: pointer; font-size: .85rem; font-weight: 700;
  color: rgba(255,255,255,.75); border-bottom: 3px solid transparent;
  white-space: nowrap; background: none;
  border-top: none; border-left: none; border-right: none;
  transition: all .2s;
}
.nav-tab:hover  { color: #fff; }
.nav-tab.active { color: #fff; border-bottom-color: #ffd966; }

/* ── CATEGORY PILLS ── */
.category-bar {
  padding: 10px 16px; overflow-x: auto; display: flex; gap: 8px;
  max-width: 1280px; margin: 0 auto; scrollbar-width: none;
}
.category-bar::-webkit-scrollbar { display: none; }
.cat-pill {
  padding: 6px 16px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--card);
  cursor: pointer; font-size: .82rem; font-weight: 700;
  white-space: nowrap; color: var(--text); transition: all .2s;
}
.cat-pill:hover  { border-color: var(--pri); color: var(--pri); }
.cat-pill.active { background: var(--pri); color: #fff; border-color: var(--pri); }

/* ── BANNER ── */
.hero-banner {
  max-width: 1280px; margin: 12px auto 0; padding: 0 16px;
}
.hero-inner {
  background: linear-gradient(135deg, #ff4747 0%, #ff8c00 60%, #ffd000 100%);
  border-radius: var(--r12); padding: 20px 28px;
  display: flex; align-items: center; justify-content: space-between;
  overflow: hidden; position: relative;
}
.hero-inner::after {
  content: '🛍️'; font-size: 6rem; position: absolute; left: 20px;
  opacity: .15; pointer-events: none;
}
.hero-text h2 { font-size: 1.5rem; font-weight: 900; color: #fff; }
.hero-text p  { font-size: .88rem; color: rgba(255,255,255,.85); margin-top: 4px; }

/* ── MAIN CONTENT ── */
#main-content { max-width: 1280px; margin: 0 auto; padding: 12px 16px 80px; }

/* ── PRODUCT GRID ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; margin-top: 16px;
}
.section-header h3 {
  font-size: 1rem; font-weight: 800; color: var(--text);
  border-right: 4px solid var(--pri); padding-right: 10px;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 540px)  { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 800px)  { .product-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1080px) { .product-grid { grid-template-columns: repeat(5, 1fr); } }

.product-card {
  background: var(--card); border-radius: var(--r12);
  box-shadow: var(--sh); overflow: hidden; cursor: pointer;
  transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column;
  border: 1.5px solid transparent;
}
.product-card:hover { transform: translateY(-4px); box-shadow: var(--sh2); border-color: var(--border); }

.product-img {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 3.5rem; background: #fafafa; overflow: hidden; position: relative;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.sold-badge {
  position: absolute; bottom: 6px; right: 6px;
  background: rgba(0,0,0,.55); color: #fff;
  font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 20px;
}

.product-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.product-name {
  font-size: .84rem; font-weight: 600; color: var(--text); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.product-price {
  font-size: 1.15rem; font-weight: 900; color: var(--pri);
  letter-spacing: -.5px; margin-top: 2px;
}
.product-price .sym { font-size: .75rem; font-weight: 700; }
.product-seller { font-size: .72rem; color: var(--muted); }
.stars { font-size: .72rem; color: var(--gold); letter-spacing: 1px; }
.stock-tag {
  display: inline-block; font-size: .68rem; padding: 2px 8px;
  border-radius: 20px; font-weight: 700;
}
.stock-tag.in  { background: #dcfce7; color: #166534; }
.stock-tag.low { background: #fef9c3; color: #854d0e; }
.stock-tag.out { background: #fee2e2; color: #991b1b; }

.add-cart-btn {
  margin-top: 6px; background: var(--pri); color: #fff; border: none;
  border-radius: var(--r8); padding: 7px; font-size: .8rem; font-weight: 800;
  cursor: pointer; transition: background .2s; width: 100%;
}
.add-cart-btn:hover    { background: #c62222; }
.add-cart-btn:disabled { background: #ccc; cursor: not-allowed; }

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── AUTH MODAL ── */
#auth-screen {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 500;
  align-items: center; justify-content: center; padding: 20px;
}
#auth-screen.active { display: flex; }
.auth-box {
  background: var(--card); border-radius: var(--r12); padding: 32px;
  width: 100%; max-width: 400px; box-shadow: var(--sh2);
}
.auth-logo { text-align: center; font-size: 2rem; font-weight: 900; color: var(--pri); margin-bottom: 6px; }
.auth-logo span { color: var(--pri2); }
.auth-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
.auth-tabs {
  display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px;
}
.auth-tab {
  flex: 1; padding: 10px; text-align: center; cursor: pointer;
  font-weight: 700; color: var(--muted); border: none; background: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s;
}
.auth-tab.active { color: var(--pri); border-bottom-color: var(--pri); }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .82rem; font-weight: 700; margin-bottom: 5px; color: var(--text); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: var(--r8); font-size: .93rem; outline: none;
  transition: border-color .2s; font-family: inherit; direction: rtl; background: #fafafa;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--pri); background: #fff;
}
.btn-primary {
  width: 100%; padding: 12px; background: var(--pri); color: #fff;
  border: none; border-radius: var(--r8); font-size: 1rem; font-weight: 800;
  cursor: pointer; transition: background .2s;
}
.btn-primary:hover { background: #c62222; }
.btn-danger {
  background: var(--pri); color: #fff; border: none; border-radius: var(--r8);
  padding: 7px 14px; cursor: pointer; font-size: .82rem; font-weight: 700;
  transition: background .2s;
}
.btn-danger:hover { background: #c62222; }
.btn-secondary {
  background: var(--bg); color: var(--text); border: 1.5px solid var(--border);
  border-radius: var(--r8); padding: 7px 14px; cursor: pointer;
  font-size: .82rem; font-weight: 700; transition: all .2s;
}
.btn-secondary:hover { border-color: var(--pri); color: var(--pri); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 400;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--card); border-radius: var(--r12); padding: 24px;
  width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--sh2); position: relative;
}
.modal-close {
  position: absolute; top: 14px; left: 14px; background: var(--bg);
  border: none; font-size: 1.1rem; cursor: pointer; color: var(--muted);
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); color: var(--text); }

/* ── PRODUCT DETAIL ── */
.product-detail-img {
  width: 100%; aspect-ratio: 4/3; display: flex; align-items: center;
  justify-content: center; font-size: 6rem; background: #fafafa;
  border-radius: var(--r8); margin-bottom: 16px; overflow: hidden;
}
.product-detail-img img { width: 100%; height: 100%; object-fit: cover; }
.product-detail-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; line-height: 1.35; }
.product-detail-price {
  font-size: 1.8rem; font-weight: 900; color: var(--pri); margin-bottom: 10px;
}
.product-detail-price .sym { font-size: 1rem; }
.product-detail-meta {
  display: flex; gap: 12px; font-size: .82rem; color: var(--muted);
  margin-bottom: 10px; flex-wrap: wrap; align-items: center;
}
.product-detail-desc { font-size: .92rem; line-height: 1.6; color: var(--text); margin-bottom: 16px; }
.qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qty-btn {
  width: 32px; height: 32px; border: 2px solid var(--border); border-radius: 6px;
  background: var(--card); font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-weight: 800;
  transition: all .2s;
}
.qty-btn:hover { border-color: var(--pri); color: var(--pri); }
.qty-display { font-size: 1rem; font-weight: 800; min-width: 28px; text-align: center; }

/* ── CART DRAWER ── */
#cart-drawer {
  position: fixed; top: 0; left: -100%;
  width: 360px; max-width: 100vw; height: 100vh;
  background: var(--card); z-index: 450; box-shadow: var(--sh2);
  transition: left .3s ease; display: flex; flex-direction: column;
}
#cart-drawer.open { left: 0; }
.cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 440; display: none; }
.cart-overlay.active { display: block; }
.cart-header {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--pri);
}
.cart-header h3 { font-size: 1.1rem; font-weight: 800; color: #fff; }
.cart-close { background: rgba(255,255,255,.2); border: none; color: #fff; font-size: 1.2rem; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; }
.cart-items { flex: 1; overflow-y: auto; padding: 14px; }
.cart-item {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.cart-item-img {
  width: 52px; height: 52px; background: #fafafa; border-radius: var(--r8);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border);
}
.cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: .84rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-item-price { font-size: .82rem; color: var(--pri); font-weight: 800; }
.cart-item-qty { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cart-qty-btn {
  width: 22px; height: 22px; border: 1.5px solid var(--border); border-radius: 4px;
  background: none; cursor: pointer; font-size: .85rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.cart-qty-btn:hover { border-color: var(--pri); color: var(--pri); }
.cart-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .95rem; padding: 4px; }
.cart-remove:hover { color: var(--pri); }
.cart-footer { padding: 16px 20px; border-top: 2px solid var(--border); }
.cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 900; margin-bottom: 14px; }
.cart-total .amount { color: var(--pri); }
.empty-cart { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-cart .icon { font-size: 3.5rem; margin-bottom: 10px; }

/* ── CHECKOUT ── */
.checkout-total { background: #fff8f8; border: 1.5px solid #fecaca; border-radius: var(--r8); padding: 14px; margin-bottom: 16px; }
.checkout-total-row { display: flex; justify-content: space-between; font-size: .88rem; margin-bottom: 5px; color: var(--muted); }
.checkout-total-row.total { font-size: 1.05rem; font-weight: 900; color: var(--text); border-top: 1px solid #fecaca; padding-top: 8px; margin-top: 6px; }

/* ── RECEIPT ── */
.receipt-box { background: var(--bg); border-radius: var(--r8); padding: 18px; margin: 16px 0; }
.receipt-row { display: flex; justify-content: space-between; font-size: .88rem; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.receipt-row:last-child { border-bottom: none; }
.receipt-success { text-align: center; margin-bottom: 14px; }
.receipt-success .icon { font-size: 3rem; }
.receipt-success h3 { color: var(--green); font-size: 1.15rem; margin-top: 6px; }

/* ── SELLER DASHBOARD ── */
.dash-section-title {
  font-size: 1rem; font-weight: 800; margin-bottom: 14px; color: var(--text);
  display: flex; align-items: center; gap: 8px; margin-top: 20px;
}
.product-form {
  background: var(--card); border-radius: var(--r12); padding: 20px;
  box-shadow: var(--sh); margin-bottom: 20px;
  border-top: 4px solid var(--pri);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

.listings-table {
  width: 100%; border-collapse: collapse; background: var(--card);
  border-radius: var(--r12); overflow: hidden; box-shadow: var(--sh); font-size: .83rem;
}
.listings-table th {
  background: #fff5f5; padding: 10px 12px; text-align: right;
  font-weight: 800; color: var(--muted); border-bottom: 2px solid var(--border);
}
.listings-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.listings-table tr:last-child td { border-bottom: none; }
.listings-table tr:hover td { background: #fffbfb; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: .72rem; font-weight: 800; }
.badge-blue  { background: #dbeafe; color: #1e40af; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-red   { background: #fee2e2; color: #991b1b; }
.badge-orange{ background: #fff7ed; color: #c2410c; }

/* ── STATS CARDS ── */
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-card {
  flex: 1; min-width: 110px; background: var(--card); border-radius: var(--r12);
  padding: 16px 18px; box-shadow: var(--sh); text-align: center;
  border-top: 3px solid var(--pri);
}
.stat-card.green { border-top-color: var(--green); }
.stat-card.orange { border-top-color: var(--pri2); }
.stat-val { font-size: 1.6rem; font-weight: 900; color: var(--pri); }
.stat-card.green .stat-val { color: var(--green); }
.stat-card.orange .stat-val { color: var(--pri2); }
.stat-label { font-size: .75rem; color: var(--muted); margin-top: 3px; font-weight: 700; }

/* ── ORDERS ── */
.order-card {
  background: var(--card); border-radius: var(--r12); padding: 16px;
  box-shadow: var(--sh); margin-bottom: 12px;
  border-right: 4px solid var(--green);
}
.order-card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
}
.order-id { font-size: .75rem; color: var(--muted); }
.order-items-list { font-size: .85rem; }
.order-item-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--bg); }

/* ── TOAST ── */
#toast-container {
  position: fixed; bottom: 20px; right: 16px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: #1a1a2e; color: #fff; padding: 10px 18px;
  border-radius: var(--r8); font-size: .86rem; font-weight: 600;
  box-shadow: var(--sh2); animation: slideUp .3s ease; max-width: 290px;
}
.toast.success { background: #166534; }
.toast.error   { background: #991b1b; }
.toast.info    { background: #1e40af; }
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── LOADING ── */
.spinner {
  width: 36px; height: 36px; border: 4px solid var(--border);
  border-top-color: var(--pri); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 36px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,.82); z-index: 600;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
}
#loading-overlay.active { display: flex; }
#loading-overlay p { color: var(--muted); font-weight: 700; }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 64px 20px; color: var(--muted); }
.empty-state .icon { font-size: 4rem; margin-bottom: 12px; }
.empty-state h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; color: var(--text); }
.empty-state p { font-size: .88rem; }

.divider { height: 1px; background: var(--border); margin: 14px 0; }
.text-muted { color: var(--muted); font-size: .83rem; }
.fw-bold { font-weight: 700; }
.no-products-msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }

/* ── MOBILE FIXES ── */
@media (max-width: 480px) {
  .hero-inner { padding: 16px 18px; }
  .hero-text h2 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-msg">מתחבר...</p>
</div>

<script>
// ═══ CONSTANTS & STATE ═══
const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';
const MARKET_NS   = 'poninio_market_v1_2026';
const BANK_NS     = 'poninio_bank_birgsol_v1_2026';

let mqttClient = null;
let currentUser = null;
let products    = {};
let cart        = [];
let activeCategory = 'הכל';
let searchQuery    = '';
let activeTab      = 'browse';
let pendingBankResolve = null;
let bankAccountCache   = {};

const CATEGORIES = ['הכל','אלקטרוניקה','ביגוד','ריהוט','מזון','אחר'];
const CAT_EMOJI  = {'אלקטרוניקה':'📱','ביגוד':'👕','ריהוט':'🪑','מזון':'🍎','אחר':'📦','הכל':'🏷️'};

// ═══ MQTT ═══
function initMQTT() {
  const clientId = 'bshop_' + Math.random().toString(36).substr(2, 9);
  mqttClient = mqtt.connect(MQTT_BROKER, { clientId, clean:true, reconnectPeriod:3000, connectTimeout:10000, keepalive:60 });

  mqttClient.on('connect', () => {
    setConnPill('connected', '🟢 מחובר');
    hideLoading();
    mqttClient.subscribe(MARKET_NS + '/#', { qos:1 });
    mqttClient.subscribe(BANK_NS + '/account/#', { qos:1 });
  });
  mqttClient.on('reconnect', () => setConnPill('connecting', '🟡 מתחבר...'));
  mqttClient.on('offline',   () => setConnPill('disconnected', '🔴 מנותק'));
  mqttClient.on('error',     (e) => { setConnPill('disconnected', '🔴 שגיאה'); console.error(e); });

  mqttClient.on('message', (topic, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      if (topic.startsWith(MARKET_NS + '/product/')) {
        const id = decodeURIComponent(topic.replace(MARKET_NS + '/product/', ''));
        if (data && data.id) { products[id] = data; } else { delete products[id]; }
        if (activeTab === 'browse')  renderProducts();
        if (activeTab === 'seller' && currentUser) renderSellerDash();
      } else if (topic.startsWith(MARKET_NS + '/user/')) {
        const uname = decodeURIComponent(topic.replace(MARKET_NS + '/user/', ''));
        if (currentUser && uname === currentUser.username && data) {
          currentUser.orders   = data.orders   || currentUser.orders;
          currentUser.listings = data.listings || currentUser.listings;
        }
      } else if (topic.startsWith(BANK_NS + '/account/')) {
        const uname = decodeURIComponent(topic.replace(BANK_NS + '/account/', ''));
        bankAccountCache[uname] = data;
        if (pendingBankResolve && pendingBankResolve.username === uname) {
          const resolve = pendingBankResolve.resolve;
          pendingBankResolve = null;
          resolve(data);
        }
      }
    } catch(e) {}
  });
}

function publishRetained(topic, data) {
  return new Promise((resolve, reject) => {
    if (!mqttClient || !mqttClient.connected) { reject(new Error('לא מחובר')); return; }
    mqttClient.publish(topic, JSON.stringify(data), { qos:1, retain:true }, (err) => err ? reject(err) : resolve());
  });
}

function getBankAccount(username) {
  return new Promise((resolve) => {
    if (bankAccountCache[username]) { resolve(bankAccountCache[username]); return; }
    const topic = BANK_NS + '/account/' + encodeURIComponent(username);
    mqttClient.subscribe(topic, { qos:1 });
    const timeout = setTimeout(() => { pendingBankResolve = null; resolve(null); }, 6000);
    pendingBankResolve = { username, resolve: (d) => { clearTimeout(timeout); resolve(d); } };
  });
}

// ═══ AUTH ═══
function showAuthModal() {
  if (currentUser) { if (confirm('התנתק מהחשבון?')) doLogout(); return; }
  document.getElementById('auth-screen').classList.add('active');
}
function hideAuthModal() { document.getElementById('auth-screen').classList.remove('active'); }
function switchAuthTab(tab) {
  document.getElementById('login-form').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? '' : 'none';
  document.getElementById('auth-tab-login').classList.toggle('active',    tab==='login');
  document.getElementById('auth-tab-register').classList.toggle('active', tab==='register');
}

function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!username || !password) { toast('מלא את כל השדות', 'error'); return; }
  const topic = MARKET_NS + '/user/' + encodeURIComponent(username);
  showLoading('מאמת...');
  mqttClient.subscribe(topic, { qos:1 });
  const timeout = setTimeout(() => { hideLoading(); toast('משתמש לא נמצא. הירשם תחילה.', 'error'); }, 5000);
  const checkLogin = (t, payload) => {
    if (t !== topic) return;
    clearTimeout(timeout);
    mqttClient.removeListener('message', checkLogin);
    hideLoading();
    try {
      const data = JSON.parse(payload.toString());
      if (!data || !data.username) { toast('משתמש לא נמצא', 'error'); return; }
      if (data.password !== password) { toast('סיסמה שגויה', 'error'); return; }
      currentUser = data; onLoginSuccess();
    } catch(e) { toast('שגיאה', 'error'); }
  };
  mqttClient.on('message', checkLogin);
}

function doRegister() {
  const username    = document.getElementById('reg-username').value.trim();
  const password    = document.getElementById('reg-password').value.trim();
  const bankUsername= document.getElementById('reg-bankuser').value.trim();
  const role        = document.getElementById('reg-role').value;
  if (!username || !password || !bankUsername) { toast('מלא את כל השדות', 'error'); return; }
  if (!/^[a-zA-Z0-9_\u0590-\u05FF]+$/.test(username)) { toast('שם משתמש: אותיות וספרות בלבד', 'error'); return; }
  const userData = { username, password, bankUsername, role, orders:[], listings:[], timestamp: new Date().toISOString() };
  showLoading('רושם...');
  publishRetained(MARKET_NS + '/user/' + encodeURIComponent(username), userData)
    .then(() => { currentUser = userData; hideLoading(); onLoginSuccess(); toast('ברוך הבא ' + username + '! 🎉', 'success'); })
    .catch((e) => { hideLoading(); toast('שגיאה: ' + e.message, 'error'); });
}

function onLoginSuccess() {
  hideAuthModal();
  document.getElementById('auth-btn').textContent = '👤 ' + currentUser.username;
  document.getElementById('auth-btn').classList.add('logout');
  renderProducts(); renderSellerDash(); renderOrders();
  toast('ברוך הבא, ' + currentUser.username + '!', 'success');
}
function doLogout() {
  currentUser = null; cart = []; updateCartBadge();
  document.getElementById('auth-btn').textContent = 'התחברות';
  document.getElementById('auth-btn').classList.remove('logout');
  toast('התנתקת בהצלחה'); switchTab('browse');
}

// ═══ NAVIGATION ═══
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('category-bar').style.display = tab==='browse' ? '' : 'none';
  const hero = document.getElementById('hero-banner');
  if (hero) hero.style.display = tab==='browse' ? '' : 'none';
  if (tab==='seller') { if (!currentUser) { toast('יש להתחבר תחילה','error'); switchTab('browse'); return; } renderSellerDash(); }
  if (tab==='orders') { if (!currentUser) { toast('יש להתחבר תחילה','error'); switchTab('browse'); return; } renderOrders(); }
}

// ═══ CATEGORIES & SEARCH ═══
function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
  renderProducts();
}
function onSearch() {
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  const hero = document.getElementById('hero-banner');
  if (hero) hero.style.display = searchQuery ? 'none' : '';
  renderProducts();
}
function getFilteredProducts() {
  return Object.values(products).filter(p => {
    if (!p || !p.id) return false;
    const matchCat    = activeCategory==='הכל' || p.category===activeCategory;
    const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery) || (p.description||'').toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  }).sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
}

// ═══ PRODUCT GRID ═══
function renderProducts() {
  const grid  = document.getElementById('product-grid');
  const title = document.getElementById('grid-title');
  const list  = getFilteredProducts();

  if (title) {
    if (searchQuery) title.textContent = 'תוצאות לחיפוש: "' + searchQuery + '" (' + list.length + ')';
    else if (activeCategory==='הכל') title.textContent = 'כל המוצרים (' + list.length + ')';
    else title.textContent = CAT_EMOJI[activeCategory] + ' ' + activeCategory + ' (' + list.length + ')';
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="no-products-msg">
      <div style="font-size:3.5rem;margin-bottom:10px">🛍️</div>
      <h3 style="font-weight:800;margin-bottom:6px;font-size:1.1rem">אין מוצרים להצגה</h3>
      <p style="font-size:.88rem;color:var(--muted)">המוכרים טרם הוסיפו מוצרים בקטגוריה זו</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(productCardHTML).join('');
}

function starsHTML(sold) {
  const n = Math.min(5, Math.max(1, Math.round(3.5 + (sold||0)/20)));
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

function productCardHTML(p) {
  const imgHTML = p.imageUrl
    ? `<img src="${escapeHTML(p.imageUrl)}" alt="${escapeHTML(p.name)}" onerror="this.parentElement.innerHTML='${getCatEmoji(p.category)}';">`
    : getCatEmoji(p.category);
  const inStock = p.stock > 0;
  return `
  <div class="product-card" onclick="openProductModal('${escapeHTML(p.id)}')">
    <div class="product-img">
      ${imgHTML}
      ${(p.sold||0)>0 ? `<div class="sold-badge">${p.sold} נמכרו</div>` : ''}
    </div>
    <div class="product-info">
      <div class="product-name">${escapeHTML(p.name)}</div>
      <div class="stars">${starsHTML(p.sold)}</div>
      <div class="product-price"><span class="sym">)( </span>${formatPrice(p.price)}</div>
      <div class="product-seller">👤 ${escapeHTML(p.seller)} &nbsp; ${stockTagHTML(p.stock)}</div>
      <button class="add-cart-btn" onclick="event.stopPropagation(); addToCart('${escapeHTML(p.id)}')" ${!inStock ? 'disabled' : ''}>
        ${inStock ? '🛒 הוסף לסל' : '❌ אזל המלאי'}
      </button>
    </div>
  </div>`;
}

function stockTagHTML(stock) {
  if (stock<=0) return '<span class="stock-tag out">אזל</span>';
  if (stock<=3) return '<span class="stock-tag low">נותרו '+stock+'</span>';
  return '<span class="stock-tag in">במלאי</span>';
}

// ═══ PRODUCT DETAIL MODAL ═══
function openProductModal(productId) {
  const p = products[productId]; if (!p) return;
  const imgHTML = p.imageUrl
    ? `<img src="${escapeHTML(p.imageUrl)}" alt="${escapeHTML(p.name)}" onerror="this.parentElement.innerHTML='${getCatEmoji(p.category)}';">`
    : getCatEmoji(p.category);
  document.getElementById('product-modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal('product-modal')">✕</button>
    <div class="product-detail-img">${imgHTML}</div>
    <h2 class="product-detail-title">${escapeHTML(p.name)}</h2>
    <div class="product-detail-price"><span class="sym">)( </span>${formatPrice(p.price)}</div>
    <div class="product-detail-meta">
      <span style="color:var(--gold);letter-spacing:1px">${starsHTML(p.sold)}</span>
      <span>${p.sold||0} נמכרו</span>
      <span>📦 ${escapeHTML(p.category)}</span>
      <span>👤 ${escapeHTML(p.seller)}</span>
      <span>${stockTagHTML(p.stock)}</span>
    </div>
    <p class="product-detail-desc">${escapeHTML(p.description||'אין תיאור')}</p>
    <div class="qty-row">
      <span style="font-weight:700;margin-left:8px">כמות:</span>
      <button class="qty-btn" onclick="changeModalQty(-1)">−</button>
      <span class="qty-display" id="modal-qty">1</span>
      <button class="qty-btn" onclick="changeModalQty(1)">+</button>
      <span class="text-muted">(במלאי: ${p.stock})</span>
    </div>
    <button class="btn-primary" onclick="addToCartFromModal('${escapeHTML(p.id)}')" ${p.stock<=0 ? 'disabled style="background:#ccc"' : ''}>
      ${p.stock>0 ? '🛒 הוסף לסל' : '❌ אזל המלאי'}
    </button>`;
  document.getElementById('product-modal').classList.add('active');
  document.getElementById('product-modal')._productId = productId;
}
function changeModalQty(delta) {
  const el = document.getElementById('modal-qty'); if (!el) return;
  const p  = products[document.getElementById('product-modal')._productId];
  let qty  = parseInt(el.textContent) + delta;
  qty = Math.max(1, Math.min(qty, p ? p.stock : 99));
  el.textContent = qty;
}
function addToCartFromModal(productId) {
  addToCart(productId, parseInt(document.getElementById('modal-qty').textContent)||1);
  closeModal('product-modal');
}

// ═══ CART ═══
function addToCart(productId, qty=1) {
  if (!currentUser) { toast('יש להתחבר תחילה','error'); return; }
  const p = products[productId]; if (!p) return;
  if (p.stock<=0) { toast('המוצר אינו במלאי','error'); return; }
  const existing = cart.find(i => i.product.id===productId);
  if (existing) { existing.qty = Math.min(existing.qty+qty, p.stock); }
  else { cart.push({ product:p, qty: Math.min(qty, p.stock) }); }
  updateCartBadge();
  toast('נוסף לסל: ' + p.name, 'success');
}
function updateCartBadge() {
  const total = cart.reduce((s,i) => s+i.qty, 0);
  const badge = document.getElementById('cart-badge');
  badge.textContent = total;
  badge.style.display = total>0 ? 'flex' : 'none';
}
function openCart()  { renderCartDrawer(); document.getElementById('cart-drawer').classList.add('open'); document.getElementById('cart-overlay').classList.add('active'); }
function closeCart() { document.getElementById('cart-drawer').classList.remove('open'); document.getElementById('cart-overlay').classList.remove('active'); }
function renderCartDrawer() {
  const listEl   = document.getElementById('cart-items-list');
  const footerEl = document.getElementById('cart-footer');
  if (cart.length===0) {
    listEl.innerHTML = `<div class="empty-cart"><div class="icon">🛒</div><p>הסל ריק</p></div>`;
    footerEl.innerHTML = '';
    return;
  }
  listEl.innerHTML = cart.map((item, idx) => {
    const p = item.product;
    const imgHTML = p.imageUrl
      ? `<img src="${escapeHTML(p.imageUrl)}" alt="" onerror="this.parentElement.innerHTML='${getCatEmoji(p.category)}';">`
      : getCatEmoji(p.category);
    return `<div class="cart-item">
      <div class="cart-item-img">${imgHTML}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${escapeHTML(p.name)}</div>
        <div class="cart-item-price">)( ${formatPrice(p.price)} × ${item.qty} = )( ${formatPrice(p.price*item.qty)}</div>
        <div class="cart-item-qty">
          <button class="cart-qty-btn" onclick="changeCartQty(${idx},-1)">−</button>
          <span style="font-size:.9rem;font-weight:800">${item.qty}</span>
          <button class="cart-qty-btn" onclick="changeCartQty(${idx},1)">+</button>
        </div>
      </div>
      <button class="cart-remove" onclick="removeFromCart(${idx})" title="הסר">🗑️</button>
    </div>`;
  }).join('');
  const total = cartTotal();
  footerEl.innerHTML = `
    <div class="cart-total"><span>סה"כ:</span><span class="amount">)( ${formatPrice(total)}</span></div>
    <button class="btn-primary" onclick="openCheckout()">לתשלום →</button>`;
}
function changeCartQty(idx, delta) {
  const item = cart[idx]; if (!item) return;
  item.qty = Math.max(1, Math.min(item.qty+delta, item.product.stock));
  renderCartDrawer(); updateCartBadge();
}
function removeFromCart(idx) { cart.splice(idx,1); renderCartDrawer(); updateCartBadge(); }
function cartTotal() { return cart.reduce((s,i) => s+i.product.price*i.qty, 0); }

// ═══ CHECKOUT ═══
function openCheckout() {
  if (cart.length===0) { toast('הסל ריק','error'); return; }
  if (!currentUser)    { toast('יש להתחבר תחילה','error'); return; }
  const rows = cart.map(i => `<div class="checkout-total-row"><span>${escapeHTML(i.product.name)} × ${i.qty}</span><span>)( ${formatPrice(i.product.price*i.qty)}</span></div>`).join('');
  document.getElementById('checkout-summary').innerHTML = `
    <div class="checkout-total">${rows}
      <div class="checkout-total-row total"><span>סה"כ לתשלום</span><span>)( ${formatPrice(cartTotal())}</span></div>
    </div>`;
  document.getElementById('checkout-bank-user').value = currentUser.bankUsername || '';
  document.getElementById('checkout-bank-pass').value = '';
  document.getElementById('checkout-modal').classList.add('active');
  closeCart();
}

async function processPayment() {
  const bankUser = document.getElementById('checkout-bank-user').value.trim();
  const bankPass = document.getElementById('checkout-bank-pass').value.trim();
  if (!bankUser || !bankPass) { toast('מלא פרטי בנק','error'); return; }
  showLoading('בודק חשבון בנק...');
  try {
    const buyerAccount = await getBankAccount(bankUser);
    if (!buyerAccount)              { hideLoading(); toast('חשבון בנק לא נמצא: '+bankUser,'error'); return; }
    if (buyerAccount.password!==bankPass) { hideLoading(); toast('סיסמת בנק שגויה','error'); return; }
    const total   = cartTotal();
    const balance = parseFloat(buyerAccount.balance)||0;
    if (balance<total) { hideLoading(); toast('יתרה לא מספיקה. יתרה: )( '+formatPrice(balance),'error'); return; }

    const bySeller = {};
    cart.forEach(item => { const s=item.product.seller; if (!bySeller[s]) bySeller[s]=[]; bySeller[s].push(item); });

    const orderId  = 'order_' + Date.now();
    const orderItems = cart.map(i => ({ productId:i.product.id, name:i.product.name, price:i.product.price, qty:i.qty, seller:i.product.seller, subtotal:i.product.price*i.qty }));

    const updatedBuyer = {
      ...buyerAccount,
      balance: (balance-total).toFixed(2),
      history: [...(buyerAccount.history||[]), { type:'payment', amount:total, description:'רכישה ב-BSHOP #'+orderId, timestamp:new Date().toISOString() }]
    };
    showLoading('מעביר תשלום...');
    await publishRetained(BANK_NS+'/account/'+encodeURIComponent(bankUser), updatedBuyer);
    bankAccountCache[bankUser] = updatedBuyer;

    for (const [seller, items] of Object.entries(bySeller)) {
      const sellerTotal = items.reduce((s,i) => s+i.product.price*i.qty, 0);
      let sellerBankUser = seller;
      const sellerProfile = await fetchSellerProfile(seller);
      if (sellerProfile && sellerProfile.bankUsername) sellerBankUser = sellerProfile.bankUsername;
      const sellerAccount = await getBankAccount(sellerBankUser);
      if (sellerAccount) {
        const updatedSeller = {
          ...sellerAccount,
          balance: (parseFloat(sellerAccount.balance||0)+sellerTotal).toFixed(2),
          history: [...(sellerAccount.history||[]), { type:'income', amount:sellerTotal, description:'מכירה ב-BSHOP #'+orderId+' מ-'+currentUser.username, timestamp:new Date().toISOString() }]
        };
        await publishRetained(BANK_NS+'/account/'+encodeURIComponent(sellerBankUser), updatedSeller);
        bankAccountCache[sellerBankUser] = updatedSeller;
      }
      for (const item of items) {
        const p = products[item.productId];
        if (p) {
          const updated = { ...p, stock:Math.max(0,p.stock-item.qty), sold:(p.sold||0)+item.qty };
          await publishRetained(MARKET_NS+'/product/'+encodeURIComponent(p.id), updated);
          products[p.id] = updated;
        }
      }
    }

    const order = { id:orderId, items:orderItems, total, timestamp:new Date().toISOString(), status:'הושלם' };
    currentUser.orders = [...(currentUser.orders||[]), order];
    await publishRetained(MARKET_NS+'/user/'+encodeURIComponent(currentUser.username), currentUser);

    hideLoading();
    closeModal('checkout-modal');
    const receiptCart = [...cart];
    cart = []; updateCartBadge(); renderProducts();
    showReceipt(order, receiptCart, updatedBuyer);
  } catch(e) { hideLoading(); toast('שגיאה בתשלום: '+e.message,'error'); console.error(e); }
}

const sellerProfileCache = {};
function fetchSellerProfile(seller) {
  return new Promise((resolve) => {
    if (sellerProfileCache[seller]) { resolve(sellerProfileCache[seller]); return; }
    const topic = MARKET_NS+'/user/'+encodeURIComponent(seller);
    mqttClient.subscribe(topic, { qos:1 });
    const timeout = setTimeout(() => resolve(null), 3000);
    const handler = (t, payload) => {
      if (t!==topic) return;
      clearTimeout(timeout); mqttClient.removeListener('message', handler);
      try { const data=JSON.parse(payload.toString()); sellerProfileCache[seller]=data; resolve(data); } catch(e) { resolve(null); }
    };
    mqttClient.on('message', handler);
  });
}

function showReceipt(order, cartSnapshot, updatedAccount) {
  const itemsHTML = cartSnapshot.map(i => `<div class="receipt-row"><span>${escapeHTML(i.product.name)} × ${i.qty}</span><span>)( ${formatPrice(i.product.price*i.qty)}</span></div>`).join('');
  document.getElementById('receipt-content').innerHTML = `
    <button class="modal-close" onclick="closeModal('receipt-modal')">✕</button>
    <div class="receipt-success"><div class="icon">✅</div><h3>התשלום בוצע בהצלחה!</h3></div>
    <div class="receipt-box">
      <div class="receipt-row"><span>מספר הזמנה</span><span style="font-family:monospace;font-size:.78rem">${escapeHTML(order.id)}</span></div>
      <div class="receipt-row"><span>תאריך</span><span>${new Date(order.timestamp).toLocaleString('he-IL')}</span></div>
      ${itemsHTML}
      <div class="receipt-row" style="font-weight:900"><span>סה"כ שולם</span><span style="color:var(--pri)">)( ${formatPrice(order.total)}</span></div>
      ${updatedAccount ? `<div class="receipt-row"><span>יתרה חדשה</span><span style="color:var(--green);font-weight:800">)( ${formatPrice(parseFloat(updatedAccount.balance))}</span></div>` : ''}
    </div>
    <button class="btn-primary" onclick="closeModal('receipt-modal')">סגור</button>`;
  document.getElementById('receipt-modal').classList.add('active');
}

// ═══ SELLER DASHBOARD ═══
function renderSellerDash() {
  if (!currentUser) return;
  const myProducts = Object.values(products).filter(p => p.seller===currentUser.username);
  const totalRevenue = myProducts.reduce((s,p) => s+(p.sold||0)*p.price, 0);
  const totalSold    = myProducts.reduce((s,p) => s+(p.sold||0), 0);
  document.getElementById('seller-content').innerHTML = `
    <div class="stats-row" style="margin-top:16px">
      <div class="stat-card"><div class="stat-val green">)( ${formatPrice(totalRevenue)}</div><div class="stat-label">הכנסות כוללות</div></div>
      <div class="stat-card green"><div class="stat-val green">${totalSold}</div><div class="stat-label">פריטים שנמכרו</div></div>
      <div class="stat-card orange"><div class="stat-val orange">${myProducts.length}</div><div class="stat-label">מוצרים פעילים</div></div>
    </div>
    <div class="product-form">
      <div class="dash-section-title" style="margin-top:0">➕ הוסף מוצר חדש</div>
      <div class="form-row">
        <div class="form-group"><label>שם המוצר *</label><input type="text" id="prod-name" placeholder="שם המוצר"></div>
        <div class="form-group"><label>מחיר ()( ) *</label><input type="number" id="prod-price" placeholder="0.00" min="0" step="0.01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>קטגוריה *</label>
          <select id="prod-cat">
            <option value="אלקטרוניקה">📱 אלקטרוניקה</option>
            <option value="ביגוד">👕 ביגוד</option>
            <option value="ריהוט">🪑 ריהוט</option>
            <option value="מזון">🍎 מזון</option>
            <option value="אחר">📦 אחר</option>
          </select>
        </div>
        <div class="form-group"><label>מלאי *</label><input type="number" id="prod-stock" placeholder="כמות" min="0" value="1"></div>
      </div>
      <div class="form-group"><label>תיאור המוצר</label><textarea id="prod-desc" rows="3" placeholder="תיאור..."></textarea></div>
      <div class="form-group"><label>כתובת תמונה (URL, אופציונלי)</label><input type="text" id="prod-img" placeholder="https://..."></div>
      <button class="btn-primary" onclick="publishProduct()">📤 פרסם מוצר</button>
    </div>
    <div class="dash-section-title">📦 המוצרים שלי (${myProducts.length})</div>
    ${myProducts.length===0 ? '<p class="text-muted" style="margin-bottom:20px">עדיין לא פרסמת מוצרים</p>' : `
    <div style="overflow-x:auto;margin-bottom:24px">
      <table class="listings-table">
        <thead><tr><th>מוצר</th><th>מחיר</th><th>מלאי</th><th>נמכרו</th><th>קטגוריה</th><th>פעולות</th></tr></thead>
        <tbody>
          ${myProducts.map(p => `<tr>
            <td><div style="display:flex;align-items:center;gap:8px"><span>${getCatEmoji(p.category)}</span><span style="font-weight:700">${escapeHTML(p.name)}</span></div></td>
            <td style="font-weight:800;color:var(--pri)">)( ${formatPrice(p.price)}</td>
            <td>${stockTagHTML(p.stock)}</td>
            <td><span class="badge badge-orange">${p.sold||0}</span></td>
            <td>${escapeHTML(p.category)}</td>
            <td><div style="display:flex;gap:6px">
              <button class="btn-secondary" onclick="openEditModal('${escapeHTML(p.id)}')" style="padding:5px 10px;font-size:.8rem">✏️</button>
              <button class="btn-danger"    onclick="deleteProduct('${escapeHTML(p.id)}')" style="padding:5px 10px;font-size:.8rem">🗑️</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}`;
}

function publishProduct() {
  if (!currentUser) { toast('יש להתחבר תחילה','error'); return; }
  const name  = document.getElementById('prod-name').value.trim();
  const price = parseFloat(document.getElementById('prod-price').value);
  const cat   = document.getElementById('prod-cat').value;
  const stock = parseInt(document.getElementById('prod-stock').value)||0;
  const desc  = document.getElementById('prod-desc').value.trim();
  const img   = document.getElementById('prod-img').value.trim();
  if (!name || isNaN(price) || price<0) { toast('מלא שם ומחיר תקין','error'); return; }
  const productId = 'prod_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  const product   = { id:productId, seller:currentUser.username, name, price, description:desc, category:cat, imageUrl:img, stock, sold:0, timestamp:new Date().toISOString() };
  showLoading('מפרסם מוצר...');
  publishRetained(MARKET_NS+'/product/'+encodeURIComponent(productId), product)
    .then(() => {
      products[productId] = product;
      hideLoading(); renderSellerDash(); renderProducts();
      toast('המוצר פורסם! 🎉', 'success');
      ['prod-name','prod-price','prod-desc','prod-img'].forEach(id => document.getElementById(id).value='');
      document.getElementById('prod-stock').value='1';
    })
    .catch(e => { hideLoading(); toast('שגיאה: '+e.message,'error'); });
}

function deleteProduct(productId) {
  if (!confirm('למחוק את המוצר?')) return;
  showLoading('מוחק...');
  mqttClient.publish(MARKET_NS+'/product/'+encodeURIComponent(productId), '', { qos:1, retain:true }, (err) => {
    hideLoading();
    if (err) { toast('שגיאה במחיקה','error'); return; }
    delete products[productId]; renderSellerDash(); renderProducts();
    toast('המוצר נמחק','success');
  });
}

function openEditModal(productId) {
  const p = products[productId]; if (!p) return;
  document.getElementById('edit-form-content').innerHTML = `
    <div class="form-group"><label>שם המוצר</label><input type="text" id="edit-name" value="${escapeHTML(p.name)}"></div>
    <div class="form-row">
      <div class="form-group"><label>מחיר</label><input type="number" id="edit-price" value="${p.price}" min="0" step="0.01"></div>
      <div class="form-group"><label>מלאי</label><input type="number" id="edit-stock" value="${p.stock}" min="0"></div>
    </div>
    <div class="form-group"><label>קטגוריה</label>
      <select id="edit-cat">${['אלקטרוניקה','ביגוד','ריהוט','מזון','אחר'].map(c => `<option value="${c}" ${p.category===c?'selected':''}>${getCatEmoji(c)} ${c}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>תיאור</label><textarea id="edit-desc" rows="3">${escapeHTML(p.description||'')}</textarea></div>
    <div class="form-group"><label>תמונה (URL)</label><input type="text" id="edit-img" value="${escapeHTML(p.imageUrl||'')}"></div>
    <button class="btn-primary" onclick="saveEditProduct('${escapeHTML(productId)}')">💾 שמור שינויים</button>`;
  document.getElementById('edit-modal').classList.add('active');
}

function saveEditProduct(productId) {
  const p = products[productId]; if (!p) return;
  const name  = document.getElementById('edit-name').value.trim();
  const price = parseFloat(document.getElementById('edit-price').value);
  const stock = parseInt(document.getElementById('edit-stock').value)||0;
  const cat   = document.getElementById('edit-cat').value;
  const desc  = document.getElementById('edit-desc').value.trim();
  const img   = document.getElementById('edit-img').value.trim();
  if (!name || isNaN(price)) { toast('מלא שם ומחיר תקין','error'); return; }
  const updated = { ...p, name, price, stock, category:cat, description:desc, imageUrl:img };
  showLoading('שומר...');
  publishRetained(MARKET_NS+'/product/'+encodeURIComponent(productId), updated)
    .then(() => { products[productId]=updated; hideLoading(); closeModal('edit-modal'); renderSellerDash(); renderProducts(); toast('עודכן בהצלחה','success'); })
    .catch(e => { hideLoading(); toast('שגיאה: '+e.message,'error'); });
}

// ═══ ORDERS ═══
function renderOrders() {
  if (!currentUser) return;
  const orders = currentUser.orders||[];
  const el = document.getElementById('orders-content');
  if (orders.length===0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🧾</div><h3>אין הזמנות עדיין</h3><p>הזמנות שתבצע יופיעו כאן</p></div>`;
    return;
  }
  const sorted = [...orders].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
  el.innerHTML = `<div class="dash-section-title" style="margin-top:16px">🧾 ההזמנות שלי (${orders.length})</div>` +
    sorted.map(order => `<div class="order-card">
      <div class="order-card-header">
        <div>
          <div class="fw-bold">הזמנה #${escapeHTML(order.id.replace('order_',''))}</div>
          <div class="order-id">${new Date(order.timestamp).toLocaleString('he-IL')}</div>
        </div>
        <div style="text-align:left">
          <span class="badge badge-green">${escapeHTML(order.status||'הושלם')}</span>
          <div style="font-size:1.05rem;font-weight:900;color:var(--pri);margin-top:4px">)( ${formatPrice(order.total)}</div>
        </div>
      </div>
      <div class="order-items-list">
        ${order.items.map(item => `<div class="order-item-row"><span>${escapeHTML(item.name)} × ${item.qty}</span><span style="color:var(--muted)">)( ${formatPrice(item.subtotal)}</span></div>`).join('')}
      </div>
    </div>`).join('');
}

// ═══ UI HELPERS ═══
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function setConnPill(state, text) { const el=document.getElementById('conn-pill'); el.className='conn-pill '+state; el.textContent=text; }
function showLoading(msg='טוען...') { document.getElementById('loading-msg').textContent=msg; document.getElementById('loading-overlay').classList.add('active'); }
function hideLoading() { document.getElementById('loading-overlay').classList.remove('active'); }
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:''); el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3500);
}
function escapeHTML(str) {
  if (str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatPrice(n) { return parseFloat(n||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function getCatEmoji(cat) { return CAT_EMOJI[cat]||'📦'; }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => { if (e.target===overlay) overlay.classList.remove('active'); });
});

// ═══ INIT ═══
(function init() {
  showLoading('מתחבר לשרת...');
  setConnPill('connecting', '🟡 מתחבר...');
  setTimeout(() => renderProducts(), 4000);
  initMQTT();
})();
</script>
