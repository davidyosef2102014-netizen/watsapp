plugins {
    id 'com.android.application'
}

android {
    namespace 'com.birgsol.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.birgsol.ai'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '3.8'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
