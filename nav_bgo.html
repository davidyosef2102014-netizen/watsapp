<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BGO NAV — ניווט חכם</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  width:100%;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0a0e1a;
  color:#fff;
  direction:rtl;
}

/* ===== MAP ===== */
#map{
  position:fixed;
  inset:0;
  z-index:1;
}

/* Override Leaflet controls to dark theme */
.leaflet-control-zoom a{
  background:rgba(10,14,26,.85)!important;
  color:#06b6d4!important;
  border:1px solid rgba(6,182,212,.3)!important;
  backdrop-filter:blur(10px)!important;
}
.leaflet-control-zoom a:hover{
  background:rgba(6,182,212,.2)!important;
}
.leaflet-bar{
  border:1px solid rgba(6,182,212,.25)!important;
  box-shadow:0 4px 20px rgba(0,0,0,.5)!important;
}

/* ===== HEADER ===== */
#header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 0;
  pointer-events:none;
}
#logo{
  background:rgba(10,14,26,.7);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(6,182,212,.25);
  border-radius:14px;
  padding:8px 14px;
  font-size:18px;
  font-weight:900;
  letter-spacing:-0.5px;
  pointer-events:auto;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#logo .b{color:#fff}
#logo .go{color:#06b6d4}
#logo .nav-txt{color:#94a3b8;font-size:11px;font-weight:600;margin-right:3px;vertical-align:middle}

#gps-status{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(10,14,26,.7);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:6px 12px;
  font-size:12px;
  color:#94a3b8;
  pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#gps-dot{
  width:9px;height:9px;
  border-radius:50%;
  background:#ef4444;
  transition:background .3s;
  flex-shrink:0;
}
#gps-dot.active{
  background:#22c55e;
  box-shadow:0 0 6px #22c55e;
  animation:gpsPulse 2s ease-in-out infinite;
}
@keyframes gpsPulse{
  0%,100%{box-shadow:0 0 4px #22c55e}
  50%{box-shadow:0 0 12px #22c55e,0 0 20px rgba(34,197,94,.3)}
}

/* ===== SEARCH PANEL ===== */
#search-panel{
  position:fixed;
  top:62px;left:12px;right:12px;
  z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
}
#search-panel.hidden{
  transform:translateY(-20px);
  opacity:0;
  pointer-events:none;
}
#search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(10,14,26,.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(6,182,212,.35);
  border-radius:18px;
  padding:12px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(6,182,212,.1) inset;
}
#search-icon{
  color:#06b6d4;
  font-size:20px;
  flex-shrink:0;
}
#search-input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  font-size:16px;
  color:#fff;
  font-family:inherit;
  direction:rtl;
  caret-color:#06b6d4;
}
#search-input::placeholder{color:#475569}
#search-clear{
  background:none;
  border:none;
  color:#475569;
  font-size:20px;
  cursor:pointer;
  padding:0 2px;
  display:none;
  transition:color .2s;
}
#search-clear:hover{color:#06b6d4}
#search-clear.visible{display:block}

/* Autocomplete */
#autocomplete{
  background:rgba(10,14,26,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(6,182,212,.25);
  border-radius:14px;
  margin-top:8px;
  overflow:hidden;
  display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
#autocomplete.open{display:block}
.ac-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:rgba(6,182,212,.12)}
.ac-pin{color:#06b6d4;font-size:18px;flex-shrink:0}
.ac-text{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-addr{font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ac-loading{
  padding:16px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

/* ===== HUD — bottom panel ===== */
#hud{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:100;
  padding:0 12px 12px;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  transform:translateY(100%);
}
#hud.visible{transform:translateY(0)}

#hud-inner{
  background:rgba(10,14,26,.92);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(6,182,212,.3);
  border-radius:22px;
  padding:16px 18px 14px;
  box-shadow:0 -4px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(6,182,212,.08) inset;
}

/* Next turn row */
#next-turn-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}
#turn-arrow{
  font-size:48px;
  line-height:1;
  min-width:56px;
  text-align:center;
  filter:drop-shadow(0 0 8px rgba(6,182,212,.6));
  transition:all .3s;
  color:#06b6d4;
}
#turn-info{flex:1;min-width:0}
#turn-dist{
  font-size:28px;
  font-weight:800;
  color:#06b6d4;
  line-height:1.1;
  letter-spacing:-0.5px;
}
#turn-street{
  font-size:14px;
  color:#94a3b8;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#turn-instruction{
  font-size:13px;
  color:#06b6d4;
  margin-top:2px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Stats row */
#hud-stats{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.07);
  gap:8px;
}
.hud-stat{
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:1;
}
.hud-stat-label{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hud-stat-val{font-size:16px;font-weight:800;color:#f1f5f9}
.hud-stat-val.cyan{color:#06b6d4}
.hud-divider{width:1px;height:32px;background:rgba(255,255,255,.08);flex-shrink:0}

/* Stop nav button */
#stop-btn{
  position:fixed;
  bottom:16px;
  left:16px;
  z-index:150;
  width:46px;height:46px;
  border-radius:50%;
  background:rgba(239,68,68,.15);
  border:1.5px solid rgba(239,68,68,.5);
  color:#ef4444;
  font-size:22px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:all .2s;
  opacity:0;pointer-events:none;
}
#stop-btn.visible{opacity:1;pointer-events:auto}
#stop-btn:hover{background:rgba(239,68,68,.3);border-color:#ef4444}
#stop-btn:active{transform:scale(.92)}

/* Recalculate button */
#recalc-btn{
  position:fixed;
  bottom:72px;
  left:16px;
  z-index:150;
  background:rgba(59,130,246,.15);
  border:1.5px solid rgba(59,130,246,.5);
  color:#3b82f6;
  font-size:12px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  padding:8px 12px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:all .2s;
  opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:5px;
}
#recalc-btn.visible{opacity:1;pointer-events:auto}
#recalc-btn:hover{background:rgba(59,130,246,.3)}
#recalc-btn:active{transform:scale(.95)}

/* ===== SPEED INDICATOR ===== */
#speed-indicator{
  position:fixed;
  bottom:76px;
  right:16px;
  z-index:100;
  width:62px;height:62px;
  border-radius:50%;
  background:rgba(10,14,26,.85);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:2.5px solid #22c55e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4), 0 0 0 1px rgba(34,197,94,.15) inset;
  transition:border-color .4s, box-shadow .4s;
}
#speed-indicator.orange{border-color:#f97316;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 12px rgba(249,115,22,.3)}
#speed-indicator.red{border-color:#ef4444;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 14px rgba(239,68,68,.4)}
#speed-val{font-size:20px;font-weight:900;color:#fff;line-height:1}
#speed-unit{font-size:9px;color:#94a3b8;font-weight:600;margin-top:1px}

/* ===== PULSING BLUE DOT ===== */
.blue-dot-outer{
  width:24px;height:24px;
  border-radius:50%;
  background:rgba(59,130,246,.25);
  display:flex;align-items:center;justify-content:center;
  animation:dotPulse 2s ease-in-out infinite;
}
.blue-dot-inner{
  width:14px;height:14px;
  border-radius:50%;
  background:#3b82f6;
  border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(59,130,246,.7);
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.3);opacity:.7}
}

/* ===== ROUTE FOUND TOAST ===== */
#toast{
  position:fixed;
  top:72px;left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:300;
  background:rgba(6,182,212,.15);
  border:1px solid rgba(6,182,212,.4);
  color:#06b6d4;
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  opacity:0;
  transition:opacity .3s, transform .3s;
  white-space:nowrap;
  pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== CENTER LOCATION BUTTON ===== */
#center-btn{
  position:fixed;
  bottom:148px;
  right:16px;
  z-index:100;
  width:46px;height:46px;
  border-radius:50%;
  background:rgba(10,14,26,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(6,182,212,.35);
  color:#06b6d4;
  font-size:22px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:all .2s;
}
#center-btn:hover{background:rgba(6,182,212,.15)}
#center-btn:active{transform:scale(.92)}

/* When HUD is visible, push speed indicator up */
.hud-active #speed-indicator{bottom:calc(180px + 12px)}
.hud-active #center-btn{bottom:calc(180px + 64px + 12px)}
.hud-active #stop-btn{bottom:calc(180px - 62px)}
.hud-active #recalc-btn{bottom:calc(180px)}

/* ===== LOADING OVERLAY ===== */
#route-loading{
  position:fixed;
  inset:0;z-index:500;
  background:rgba(10,14,26,.75);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
#route-loading.show{opacity:1;pointer-events:auto}
.rl-spinner{
  width:48px;height:48px;
  border:3px solid rgba(6,182,212,.2);
  border-top-color:#06b6d4;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.rl-text{color:#94a3b8;font-size:14px}

/* ===== ARRIVED OVERLAY ===== */
#arrived-overlay{
  position:fixed;
  inset:0;z-index:600;
  background:rgba(10,14,26,.88);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;
  opacity:0;pointer-events:none;
  transition:opacity .4s;
}
#arrived-overlay.show{opacity:1;pointer-events:auto}
.arrived-emoji{font-size:72px}
.arrived-title{font-size:28px;font-weight:900;color:#06b6d4}
.arrived-sub{font-size:15px;color:#64748b}
.arrived-close{
  margin-top:8px;
  padding:12px 32px;
  background:#06b6d4;
  color:#0a0e1a;
  border:none;
  border-radius:24px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 4px 20px rgba(6,182,212,.4);
}
.arrived-close:hover{background:#0891b2}
</style>
</head>
<body>

<!-- ===== MAP ===== -->
<div id="map"></div>

<!-- ===== HEADER ===== -->
<header id="header">
  <div id="logo">
    <span class="b">B</span><span class="go">GO</span><span class="nav-txt"> NAV</span>
  </div>
  <div id="gps-status">
    <div id="gps-dot"></div>
    <span id="gps-label">מחפש GPS…</span>
  </div>
</header>

<!-- ===== SEARCH PANEL ===== -->
<div id="search-panel">
  <div id="search-box">
    <div id="search-icon">🔍</div>
    <input id="search-input" type="text" placeholder="לאן אתה נוסע?" autocomplete="off" inputmode="search">
    <button id="search-clear" title="נקה">✕</button>
  </div>
  <div id="autocomplete"></div>
</div>

<!-- ===== HUD ===== -->
<div id="hud">
  <div id="hud-inner">
    <div id="next-turn-row">
      <div id="turn-arrow">↑</div>
      <div id="turn-info">
        <div id="turn-dist">—</div>
        <div id="turn-instruction">מחשב מסלול…</div>
        <div id="turn-street"></div>
      </div>
    </div>
    <div id="hud-stats">
      <div class="hud-stat">
        <div class="hud-stat-label">נותר</div>
        <div class="hud-stat-val cyan" id="stat-remain">—</div>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-stat">
        <div class="hud-stat-label">זמן</div>
        <div class="hud-stat-val" id="stat-dur">—</div>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-stat">
        <div class="hud-stat-label">הגעה</div>
        <div class="hud-stat-val" id="stat-eta">—</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== CONTROLS ===== -->
<button id="stop-btn" title="עצור ניווט" onclick="stopNavigation()">✕</button>
<button id="recalc-btn" onclick="recalcRoute()">🔄 חישוב מחדש</button>
<button id="center-btn" title="מרכז מיקום" onclick="centerOnUser()">⊙</button>

<!-- ===== SPEED ===== -->
<div id="speed-indicator">
  <div id="speed-val">0</div>
  <div id="speed-unit">קמ"ש</div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast"></div>

<!-- ===== LOADING ===== -->
<div id="route-loading">
  <div class="rl-spinner"></div>
  <div class="rl-text">מחשב מסלול…</div>
</div>

<!-- ===== ARRIVED ===== -->
<div id="arrived-overlay">
  <div class="arrived-emoji">🏁</div>
  <div class="arrived-title">הגעת ליעד!</div>
  <div class="arrived-sub" id="arrived-dest">—</div>
  <button class="arrived-close" onclick="closeArrived()">סיים ניווט</button>
</div>

<script>
// =====================================================================
// BGO NAV — Main App
// =====================================================================

/* ---------- State ---------- */
let map, userMarker, destMarker, routeLayer;
let userPos = null;  // {lat, lng}
let destPos = null;
let navSteps = [];
let currentStepIdx = 0;
let isNavigating = false;
let watchId = null;
let totalDurationSec = 0;
let totalDistanceM = 0;
let searchTimeout = null;
let destName = '';
let autoCenter = true;

/* ---------- Init ---------- */
document.addEventListener('DOMContentLoaded', initApp);

function initApp() {
  initMap();
  initSearch();
  startGPS();
}

/* ---------- Map ---------- */
function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    center: [31.77, 35.21],
    zoom: 13,
    zoomSnap: 0.5,
  });

  // CartoDB Voyager tiles — free, no API key
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
    detectRetina: true,
  }).addTo(map);

  // Move zoom control to bottom-right
  map.zoomControl.setPosition('bottomright');

  // Disable auto-center when user pans
  map.on('dragstart', () => { autoCenter = false; });
}

/* ---------- GPS ---------- */
function startGPS() {
  if (!navigator.geolocation) {
    setGpsStatus(false, 'GPS לא נתמך');
    return;
  }
  watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
    enableHighAccuracy: true,
    maximumAge: 3000,
    timeout: 20000,
  });
}

function onPosition(pos) {
  const { latitude: lat, longitude: lng, speed } = pos.coords;
  userPos = { lat, lng };

  // GPS status
  setGpsStatus(true, 'GPS פעיל');

  // Create / update pulsing marker
  if (!userMarker) {
    const icon = L.divIcon({
      className: '',
      html: '<div class="blue-dot-outer"><div class="blue-dot-inner"></div></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12],
    });
    userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
    if (autoCenter) map.setView([lat, lng], 15);
  } else {
    userMarker.setLatLng([lat, lng]);
    if (autoCenter && !isNavigating) map.panTo([lat, lng]);
  }

  // Speed
  updateSpeedDisplay(speed);

  // Navigation step advance
  if (isNavigating && navSteps.length > 0) {
    checkStepAdvance(lat, lng);
  }
}

function onGpsError(err) {
  console.warn('GPS error', err);
  setGpsStatus(false, 'שגיאת GPS');
}

function setGpsStatus(active, label) {
  document.getElementById('gps-dot').classList.toggle('active', active);
  document.getElementById('gps-label').textContent = label;
}

function updateSpeedDisplay(speedMs) {
  const el = document.getElementById('speed-indicator');
  const val = document.getElementById('speed-val');
  const kmh = speedMs ? Math.round(speedMs * 3.6) : 0;
  val.textContent = kmh;
  el.className = '';
  if (kmh > 90) el.classList.add('red');
  else if (kmh > 60) el.classList.add('orange');
}

function centerOnUser() {
  if (userPos) {
    map.flyTo([userPos.lat, userPos.lng], 16, { animate: true, duration: 1 });
    autoCenter = true;
  }
}

/* ---------- Search ---------- */
function initSearch() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clear.classList.toggle('visible', q.length > 0);
    clearTimeout(searchTimeout);
    if (q.length < 2) { closeAutocomplete(); return; }
    searchTimeout = setTimeout(() => fetchSuggestions(q), 350);
  });

  clear.addEventListener('click', () => {
    input.value = '';
    clear.classList.remove('visible');
    closeAutocomplete();
    input.focus();
  });

  // Close autocomplete on map click
  map.on('click', closeAutocomplete);
}

async function fetchSuggestions(q) {
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = '<div class="ac-loading">מחפש…</div>';
  ac.classList.add('open');

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&accept-language=he&addressdetails=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'he' } });
    const data = await res.json();

    if (!data.length) {
      ac.innerHTML = '<div class="ac-loading">לא נמצאו תוצאות</div>';
      return;
    }

    ac.innerHTML = '';
    data.forEach(item => {
      const name = item.namedetails?.name || item.display_name.split(',')[0];
      const addr = item.display_name;
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.innerHTML = `<div class="ac-pin">📍</div><div class="ac-text"><div class="ac-name">${escHtml(name)}</div><div class="ac-addr">${escHtml(addr)}</div></div>`;
      div.addEventListener('click', () => selectDestination(item));
      ac.appendChild(div);
    });
  } catch (e) {
    ac.innerHTML = '<div class="ac-loading">שגיאת חיפוש. בדוק חיבור לאינטרנט.</div>';
  }
}

function closeAutocomplete() {
  const ac = document.getElementById('autocomplete');
  ac.classList.remove('open');
  ac.innerHTML = '';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function selectDestination(item) {
  destName = item.display_name.split(',')[0];
  destPos = { lat: parseFloat(item.lat), lng: parseFloat(item.lon) };

  document.getElementById('search-input').value = destName;
  document.getElementById('search-clear').classList.add('visible');
  closeAutocomplete();

  // Add destination marker
  if (destMarker) map.removeLayer(destMarker);
  const destIcon = L.divIcon({
    className: '',
    html: `<div style="background:#ef4444;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5)"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 18],
  });
  destMarker = L.marker([destPos.lat, destPos.lng], { icon: destIcon }).addTo(map);

  if (!userPos) {
    showToast('ממתין לאיתור GPS…');
    return;
  }
  await calcRoute();
}

/* ---------- Routing ---------- */
async function calcRoute() {
  if (!userPos || !destPos) return;
  showLoading(true);
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${userPos.lng},${userPos.lat};${destPos.lng},${destPos.lat}?steps=true&geometries=geojson&overview=full`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code !== 'Ok' || !data.routes.length) {
      showToast('לא נמצא מסלול');
      showLoading(false);
      return;
    }

    const route = data.routes[0];
    totalDurationSec = route.duration;
    totalDistanceM = route.distance;
    navSteps = route.legs[0].steps;
    currentStepIdx = 0;

    drawRoute(route.geometry.coordinates);
    startNavigation();
    updateHUD();
  } catch (e) {
    showToast('שגיאת חיבור — בדוק אינטרנט');
  }
  showLoading(false);
}

function drawRoute(coords) {
  if (routeLayer) map.removeLayer(routeLayer);

  // coords from OSRM are [lng, lat], Leaflet needs [lat, lng]
  const latLngs = coords.map(c => [c[1], c[0]]);

  // Glow effect — two layers
  const glow = L.polyline(latLngs, {
    color: '#3b82f6',
    weight: 14,
    opacity: 0.18,
    lineCap: 'round',
    lineJoin: 'round',
  }).addTo(map);

  const main = L.polyline(latLngs, {
    color: '#3b82f6',
    weight: 5,
    opacity: 0.95,
    lineCap: 'round',
    lineJoin: 'round',
  }).addTo(map);

  routeLayer = L.layerGroup([glow, main]);
  // Already added individually; store for removal
  routeLayer._glow = glow;
  routeLayer._main = main;

  // Fit bounds
  const group = L.featureGroup([glow]);
  map.fitBounds(group.getBounds(), { padding: [60, 60] });
}

function startNavigation() {
  isNavigating = true;
  autoCenter = true;

  document.getElementById('hud').classList.add('visible');
  document.getElementById('stop-btn').classList.add('visible');
  document.getElementById('recalc-btn').classList.add('visible');
  document.body.classList.add('hud-active');

  const dist = fmtDist(totalDistanceM);
  const dur = fmtDuration(totalDurationSec);
  showToast(`מסלול נמצא: ${dist} — ${dur}`);
}

function stopNavigation() {
  isNavigating = false;
  autoCenter = false;
  navSteps = [];
  currentStepIdx = 0;

  if (routeLayer) {
    if (routeLayer._glow) map.removeLayer(routeLayer._glow);
    if (routeLayer._main) map.removeLayer(routeLayer._main);
    routeLayer = null;
  }
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  destPos = null;

  document.getElementById('hud').classList.remove('visible');
  document.getElementById('stop-btn').classList.remove('visible');
  document.getElementById('recalc-btn').classList.remove('visible');
  document.body.classList.remove('hud-active');
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
}

function recalcRoute() {
  if (destPos) calcRoute();
}

/* ---------- HUD Update ---------- */
function updateHUD() {
  if (!navSteps.length) return;

  const step = navSteps[currentStepIdx];
  const maneuver = step.maneuver || {};
  const arrow = getArrow(maneuver.type, maneuver.modifier);
  const instruction = hebrewInstruction(step);
  const dist = fmtDist(step.distance);
  const street = step.name || '';

  // Remaining distance & time from current step onward
  let remDist = 0;
  let remDur = 0;
  for (let i = currentStepIdx; i < navSteps.length; i++) {
    remDist += navSteps[i].distance;
    remDur += navSteps[i].duration;
  }

  document.getElementById('turn-arrow').textContent = arrow;
  document.getElementById('turn-dist').textContent = dist;
  document.getElementById('turn-instruction').textContent = instruction;
  document.getElementById('turn-street').textContent = street;
  document.getElementById('stat-remain').textContent = fmtDist(remDist);
  document.getElementById('stat-dur').textContent = fmtDuration(remDur);
  document.getElementById('stat-eta').textContent = calcETA(remDur);

  // If arrived
  if (maneuver.type === 'arrive') {
    showArrived();
  }
}

/* ---------- Step Advance ---------- */
function checkStepAdvance(lat, lng) {
  if (currentStepIdx >= navSteps.length - 1) return;

  const step = navSteps[currentStepIdx];
  const loc = step.maneuver.location; // [lng, lat]
  const dist = haversine(lat, lng, loc[1], loc[0]);

  if (dist < 30) {
    currentStepIdx++;
    updateHUD();
    if (autoCenter && userPos) {
      map.panTo([userPos.lat, userPos.lng]);
    }
  }
}

/* ---------- Helpers ---------- */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(meters) {
  if (meters < 1000) return Math.round(meters) + ' מ\'';
  return (meters / 1000).toFixed(1) + ' ק"מ';
}

function fmtDuration(sec) {
  if (sec < 60) return 'פחות מדקה';
  const m = Math.round(sec / 60);
  if (m < 60) return `~${m} דקות`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return `${h}ש' ${rm}ד'`;
}

function calcETA(durationSeconds) {
  const eta = new Date(Date.now() + durationSeconds * 1000);
  return eta.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function getArrow(type, modifier) {
  if (type === 'turn') {
    if (modifier === 'left') return '↰';
    if (modifier === 'right') return '↱';
    if (modifier === 'slight left') return '↖';
    if (modifier === 'slight right') return '↗';
    if (modifier === 'sharp left') return '⬅';
    if (modifier === 'sharp right') return '➡';
    if (modifier === 'uturn') return '↩';
    if (modifier === 'straight') return '↑';
  }
  if (type === 'arrive') return '🏁';
  if (type === 'roundabout' || type === 'rotary') return '🔄';
  if (type === 'merge') return '↑';
  if (type === 'on ramp') return '↗';
  if (type === 'off ramp') return '↘';
  if (type === 'fork') {
    if (modifier && modifier.includes('right')) return '↗';
    if (modifier && modifier.includes('left')) return '↖';
  }
  if (type === 'end of road') {
    if (modifier && modifier.includes('right')) return '↱';
    if (modifier && modifier.includes('left')) return '↰';
  }
  return '↑';
}

function hebrewInstruction(step) {
  const t = step.maneuver.type;
  const m = step.maneuver.modifier || '';
  const name = step.name || '';

  if (t === 'turn') {
    const dir = m.includes('right') ? 'ימינה' : m.includes('left') ? 'שמאלה' : 'ישר';
    if (m === 'slight right') return `סע מעט ימינה${name ? ' אל ' + name : ''}`;
    if (m === 'slight left') return `סע מעט שמאלה${name ? ' אל ' + name : ''}`;
    if (m === 'sharp right') return `פנה חדה ימינה${name ? ' אל ' + name : ''}`;
    if (m === 'sharp left') return `פנה חדה שמאלה${name ? ' אל ' + name : ''}`;
    if (m === 'uturn') return 'בצע פניית פרסה';
    return `פנה ${dir}${name ? ' אל ' + name : ''}`;
  }
  if (t === 'arrive') return 'הגעת ליעד 🏁';
  if (t === 'roundabout' || t === 'rotary') return `כנס לכיכר${name ? ' — ' + name : ''}`;
  if (t === 'depart') return name ? `התחל ב-${name}` : 'צא לדרך';
  if (t === 'merge') return name ? `מזגן אל ${name}` : 'מזג תנועה';
  if (t === 'on ramp') return name ? `עלה לכביש ${name}` : 'עלה לכניסה';
  if (t === 'off ramp') return name ? `רד ל-${name}` : 'צא מהכניסה';
  if (t === 'fork') {
    if (m.includes('right')) return name ? `בכיכר, קח ימינה אל ${name}` : 'קח ימינה בפיצול';
    if (m.includes('left')) return name ? `בכיכר, קח שמאלה אל ${name}` : 'קח שמאלה בפיצול';
  }
  return name ? `המשך ל-${name}` : 'המשך ישר';
}

/* ---------- Toast ---------- */
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

/* ---------- Loading ---------- */
function showLoading(show) {
  document.getElementById('route-loading').classList.toggle('show', show);
}

/* ---------- Arrived ---------- */
function showArrived() {
  document.getElementById('arrived-dest').textContent = destName;
  document.getElementById('arrived-overlay').classList.add('show');
}

function closeArrived() {
  document.getElementById('arrived-overlay').classList.remove('show');
  stopNavigation();
}

/* ---------- Memory note ---------- */
// Auto-opens browser per user memory preference — no action needed here
</script>
