<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BGO NAV — ניווט חכם</title>
<link rel="manifest" href="navbgo.webmanifest">
<meta name="theme-color" content="#06b6d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BGO NAV">
<link rel="apple-touch-icon" href="navbgo-icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0a0e1a;
  color:#fff;
  direction:rtl;
  -webkit-tap-highlight-color:transparent;
}

/* ===== MAP ===== */
#map{position:fixed;inset:0;z-index:1}

/* ===== LEAFLET OVERRIDES ===== */
.leaflet-control-zoom a{
  background:rgba(10,14,26,.88)!important;
  color:#06b6d4!important;
  border:1px solid rgba(6,182,212,.3)!important;
  backdrop-filter:blur(12px)!important;
}
.leaflet-control-zoom a:hover{background:rgba(6,182,212,.2)!important}
.leaflet-bar{border:1px solid rgba(6,182,212,.2)!important;box-shadow:0 4px 24px rgba(0,0,0,.6)!important}

/* ===== NIGHT MODE ===== */
body.night #map .leaflet-tile-pane{filter:brightness(1)}
body.night .glass{background:rgba(5,8,18,.92)!important;border-color:rgba(99,102,241,.3)!important}
body.night #turn-dist,body.night #turn-instruction,body.night .hud-stat-val.cyan{color:#818cf8!important}
body.night #gps-dot.active{background:#818cf8!important;box-shadow:0 0 8px #818cf8!important}
body.night #speed-indicator{border-color:#818cf8}

/* ===== HEADER ===== */
#header{
  position:fixed;top:0;left:0;right:0;
  z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 0;
  pointer-events:none;
}
#logo{
  pointer-events:auto;
  background:rgba(10,14,26,.82);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(6,182,212,.3);
  border-radius:16px;
  padding:8px 14px;
  font-size:17px;font-weight:900;letter-spacing:-.5px;
  box-shadow:0 4px 24px rgba(0,0,0,.5);
  user-select:none;
}
#logo .lb{color:#fff}
#logo .go{color:#06b6d4}
#logo .nav-txt{color:#64748b;font-size:10px;font-weight:700;margin-right:4px;vertical-align:middle;letter-spacing:.5px}

/* Header right cluster */
.h-cluster{
  display:flex;align-items:center;gap:8px;
  pointer-events:auto;
}

/* Night toggle */
#night-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(10,14,26,.82);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  color:#f1f5f9;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:all .2s;
}
#night-btn:hover{background:rgba(6,182,212,.15)}
#night-btn:active{transform:scale(.9)}

/* Compass */
#compass{
  width:40px;height:40px;border-radius:50%;
  background:rgba(10,14,26,.82);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  pointer-events:none;
}
#compass-arrow{
  font-size:22px;line-height:1;
  transition:transform .3s ease-out;
  display:inline-block;
}

/* GPS status pill */
#gps-status{
  display:flex;align-items:center;gap:7px;
  background:rgba(10,14,26,.82);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:6px 12px;
  font-size:12px;color:#94a3b8;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#gps-dot{width:9px;height:9px;border-radius:50%;background:#ef4444;transition:background .3s;flex-shrink:0}
#gps-dot.active{background:#22c55e;box-shadow:0 0 6px #22c55e;animation:gpsPulse 2s ease-in-out infinite}
@keyframes gpsPulse{0%,100%{box-shadow:0 0 4px #22c55e}50%{box-shadow:0 0 14px #22c55e,0 0 24px rgba(34,197,94,.3)}}

/* ===== SEARCH PANEL ===== */
#search-panel{
  position:fixed;top:62px;left:12px;right:12px;
  z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
}
#search-panel.hidden{transform:translateY(-20px);opacity:0;pointer-events:none}
#search-box{
  display:flex;align-items:center;gap:10px;
  background:rgba(10,14,26,.9);
  backdrop-filter:blur(24px);
  border:1px solid rgba(6,182,212,.35);
  border-radius:18px;padding:12px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(6,182,212,.1) inset;
}
#search-icon{color:#06b6d4;font-size:20px;flex-shrink:0}
#search-input{
  flex:1;background:none;border:none;outline:none;
  font-size:16px;color:#fff;font-family:inherit;
  direction:rtl;caret-color:#06b6d4;
}
#search-input::placeholder{color:#475569}
#search-clear{
  background:none;border:none;color:#475569;font-size:20px;
  cursor:pointer;padding:0 2px;display:none;transition:color .2s;
}
#search-clear:hover{color:#06b6d4}
#search-clear.visible{display:block}

/* Autocomplete */
#autocomplete{
  background:rgba(10,14,26,.97);
  backdrop-filter:blur(24px);
  border:1px solid rgba(6,182,212,.25);
  border-radius:16px;margin-top:8px;
  overflow:hidden;display:none;
  box-shadow:0 12px 40px rgba(0,0,0,.7);
  max-height:60vh;overflow-y:auto;
}
#autocomplete.open{display:block}
.ac-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:rgba(6,182,212,.12)}
.ac-pin{color:#06b6d4;font-size:18px;flex-shrink:0}
.ac-hist-icon{color:#64748b;font-size:16px;flex-shrink:0}
.ac-text{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-addr{font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ac-loading{padding:16px;text-align:center;color:#64748b;font-size:13px}

/* ===== ROUTE ALTERNATIVES BANNER ===== */
#alt-banner{
  position:fixed;bottom:0;left:0;right:0;
  z-index:250;
  background:rgba(10,14,26,.95);
  backdrop-filter:blur(24px);
  border-top:1px solid rgba(6,182,212,.2);
  padding:14px 16px 20px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
#alt-banner.visible{transform:translateY(0)}
#alt-title{font-size:13px;font-weight:700;color:#64748b;margin-bottom:10px;text-align:center;letter-spacing:.5px}
#alt-routes{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#alt-routes::-webkit-scrollbar{display:none}
.alt-card{
  flex-shrink:0;
  background:rgba(6,182,212,.08);
  border:1.5px solid rgba(6,182,212,.25);
  border-radius:16px;padding:12px 16px;
  cursor:pointer;min-width:130px;
  transition:all .2s;
}
.alt-card:hover,.alt-card.selected{background:rgba(6,182,212,.18);border-color:#06b6d4}
.alt-dist{font-size:18px;font-weight:800;color:#fff}
.alt-dur{font-size:13px;color:#06b6d4;font-weight:700;margin-top:3px}
.alt-tag{font-size:10px;color:#64748b;margin-top:4px}
.alt-go{
  flex-shrink:0;
  background:#06b6d4;color:#0a0e1a;
  border:none;border-radius:16px;
  padding:12px 20px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;
  align-self:center;margin-right:4px;
  transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.alt-go:hover{background:#0891b2}
.alt-go:active{transform:scale(.95)}

/* ===== HUD — bottom panel ===== */
#hud{
  position:fixed;bottom:0;left:0;right:0;
  z-index:100;padding:0 12px 12px;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  transform:translateY(100%);
}
#hud.visible{transform:translateY(0)}
#hud-inner{
  background:rgba(10,14,26,.93);
  backdrop-filter:blur(28px);
  border:1px solid rgba(6,182,212,.28);
  border-radius:24px;padding:16px 18px 14px;
  box-shadow:0 -4px 40px rgba(0,0,0,.55),0 0 0 1px rgba(6,182,212,.08) inset;
}

/* Next turn row */
#next-turn-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#turn-arrow-wrap{
  width:62px;height:62px;border-radius:18px;
  background:rgba(6,182,212,.1);border:1.5px solid rgba(6,182,212,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#turn-arrow-svg{width:36px;height:36px;transition:all .3s}
#turn-info{flex:1;min-width:0}
#turn-dist{font-size:28px;font-weight:800;color:#06b6d4;line-height:1.1;letter-spacing:-.5px}
#turn-street{font-size:15px;color:#f1f5f9;margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turn-instruction{font-size:12px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Stats row */
#hud-stats{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.07);gap:8px;
}
.hud-stat{display:flex;flex-direction:column;align-items:center;flex:1}
.hud-stat-label{font-size:10px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hud-stat-val{font-size:16px;font-weight:800;color:#f1f5f9}
.hud-stat-val.cyan{color:#06b6d4}
.hud-divider{width:1px;height:32px;background:rgba(255,255,255,.08);flex-shrink:0}

/* ===== CONTROLS ===== */
#stop-btn{
  position:fixed;bottom:16px;left:16px;z-index:150;
  width:48px;height:48px;border-radius:50%;
  background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.45);
  color:#ef4444;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.45);
  transition:all .2s;opacity:0;pointer-events:none;
}
#stop-btn.visible{opacity:1;pointer-events:auto}
#stop-btn:hover{background:rgba(239,68,68,.28);border-color:#ef4444}
#stop-btn:active{transform:scale(.9)}

#recalc-btn{
  position:fixed;bottom:74px;left:16px;z-index:150;
  background:rgba(59,130,246,.12);border:1.5px solid rgba(59,130,246,.4);
  color:#60a5fa;font-size:11px;font-weight:700;font-family:inherit;
  cursor:pointer;padding:8px 12px;border-radius:14px;
  backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:all .2s;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:5px;
}
#recalc-btn.visible{opacity:1;pointer-events:auto}
#recalc-btn:hover{background:rgba(59,130,246,.25)}
#recalc-btn:active{transform:scale(.95)}

/* Center btn */
#center-btn{
  position:fixed;bottom:148px;right:16px;z-index:100;
  width:48px;height:48px;border-radius:50%;
  background:rgba(10,14,26,.87);backdrop-filter:blur(14px);
  border:1.5px solid rgba(6,182,212,.3);color:#06b6d4;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .2s;
}
#center-btn:hover{background:rgba(6,182,212,.15)}
#center-btn:active{transform:scale(.9)}

/* When HUD visible */
.hud-active #speed-indicator{bottom:calc(180px + 12px)}
.hud-active #center-btn{bottom:calc(180px + 64px + 12px)}
.hud-active #stop-btn{bottom:calc(180px - 60px)}
.hud-active #recalc-btn{bottom:calc(180px)}

/* ===== SPEED INDICATOR ===== */
#speed-indicator{
  position:fixed;bottom:76px;right:16px;z-index:100;
  width:64px;height:64px;border-radius:50%;
  background:rgba(10,14,26,.87);backdrop-filter:blur(14px);
  border:2.5px solid #22c55e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
  transition:border-color .4s,box-shadow .4s;
}
#speed-indicator.warn{border-color:#f97316;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 14px rgba(249,115,22,.35)}
#speed-indicator.danger{border-color:#ef4444;animation:speedDanger .5s ease-in-out infinite alternate;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 18px rgba(239,68,68,.5)}
@keyframes speedDanger{from{border-color:#ef4444}to{border-color:#fca5a5}}
#speed-val{font-size:21px;font-weight:900;color:#fff;line-height:1}
#speed-unit{font-size:9px;color:#94a3b8;font-weight:700;margin-top:1px}

/* Speed camera alert */
#cam-alert{
  position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-100px);
  z-index:300;
  background:rgba(239,68,68,.15);border:2px solid #ef4444;
  color:#ef4444;
  padding:10px 22px;border-radius:20px;
  font-size:14px;font-weight:800;
  backdrop-filter:blur(14px);
  box-shadow:0 4px 24px rgba(0,0,0,.5),0 0 20px rgba(239,68,68,.3);
  display:flex;align-items:center;gap:8px;
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;
  opacity:0;
}
#cam-alert.show{transform:translateX(-50%) translateY(0);opacity:1}
.cam-icon{font-size:22px}

/* ===== GPS MARKER ===== */
.blue-dot-outer{width:26px;height:26px;border-radius:50%;background:rgba(59,130,246,.2);display:flex;align-items:center;justify-content:center;animation:dotPulse 2s ease-in-out infinite}
.blue-dot-inner{width:15px;height:15px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 2px 10px rgba(59,130,246,.8)}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.7}}

/* ===== TOAST ===== */
#toast{
  position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:300;
  background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.4);
  color:#06b6d4;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;
  backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.4);
  opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== LOADING ===== */
#route-loading{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,14,26,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#route-loading.show{opacity:1;pointer-events:auto}
.rl-spinner{width:50px;height:50px;border:3px solid rgba(6,182,212,.15);border-top-color:#06b6d4;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rl-text{color:#94a3b8;font-size:14px;font-weight:600}

/* ===== ARRIVED OVERLAY + CONFETTI ===== */
#arrived-overlay{
  position:fixed;inset:0;z-index:600;
  background:rgba(5,8,18,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
#arrived-overlay.show{opacity:1;pointer-events:auto}
.arrived-emoji{font-size:80px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.arrived-title{font-size:32px;font-weight:900;color:#06b6d4}
.arrived-sub{font-size:15px;color:#64748b;text-align:center;max-width:260px}
.arrived-close{
  margin-top:8px;padding:14px 40px;
  background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;
  border:none;border-radius:28px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 6px 24px rgba(6,182,212,.45);
  transition:all .2s;
}
.arrived-close:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(6,182,212,.6)}
.arrived-close:active{transform:scale(.96)}

/* Confetti */
.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetto{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;top:-10px}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg) scale(.5)}
}

/* ===== SEARCH PANEL HIDDEN WHEN NAVIGATING ===== */
#search-panel.nav-hidden{transform:translateY(-100px);opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- HEADER -->
<header id="header">
  <div id="logo">
    <span class="lb">B</span><span class="go">GO</span><span class="nav-txt">NAV</span>
  </div>
  <div class="h-cluster">
    <div id="compass"><span id="compass-arrow">🧭</span></div>
    <button id="night-btn" onclick="toggleNight()" title="מצב לילה">🌙</button>
    <div id="gps-status">
      <div id="gps-dot"></div>
      <span id="gps-label">מחפש…</span>
    </div>
  </div>
</header>

<!-- SEARCH -->
<div id="search-panel">
  <div id="search-box">
    <div id="search-icon">🔍</div>
    <input id="search-input" type="text" placeholder="לאן אתה נוסע?" autocomplete="off" inputmode="search">
    <button id="search-clear" title="נקה">✕</button>
  </div>
  <div id="autocomplete"></div>
</div>

<!-- ROUTE ALTERNATIVES -->
<div id="alt-banner">
  <div id="alt-title">בחר מסלול</div>
  <div id="alt-routes"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-inner">
    <div id="next-turn-row">
      <div id="turn-arrow-wrap">
        <svg id="turn-arrow-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path id="arrow-path" d="M18 30 L18 8 M18 8 L10 16 M18 8 L26 16" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div id="turn-info">
        <div id="turn-dist">—</div>
        <div id="turn-street">ממתין למסלול…</div>
        <div id="turn-instruction"></div>
      </div>
    </div>
    <div id="hud-stats">
      <div class="hud-stat">
        <div class="hud-stat-label">נותר</div>
        <div class="hud-stat-val cyan" id="stat-remain">—</div>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-stat">
        <div class="hud-stat-label">זמן</div>
        <div class="hud-stat-val" id="stat-dur">—</div>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-stat">
        <div class="hud-stat-label">הגעה</div>
        <div class="hud-stat-val" id="stat-eta">—</div>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<button id="stop-btn" title="עצור ניווט" onclick="stopNavigation()">✕</button>
<button id="recalc-btn" onclick="recalcRoute()">🔄 חישוב מחדש</button>
<button id="center-btn" title="מרכז מיקום" onclick="centerOnUser()">◎</button>

<!-- SPEED -->
<div id="speed-indicator">
  <div id="speed-val">0</div>
  <div id="speed-unit">קמ"ש</div>
</div>

<!-- CAMERA ALERT -->
<div id="cam-alert"><span class="cam-icon">📷</span><span id="cam-text">מצלמת מהירות!</span></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- LOADING -->
<div id="route-loading">
  <div class="rl-spinner"></div>
  <div class="rl-text">מחשב מסלול…</div>
</div>

<!-- ARRIVED -->
<div id="arrived-overlay">
  <div class="confetti-wrap" id="confetti-wrap"></div>
  <div class="arrived-emoji">🏁</div>
  <div class="arrived-title">הגעת ליעד!</div>
  <div class="arrived-sub" id="arrived-dest">—</div>
  <button class="arrived-close" onclick="closeArrived()">סיים ניווט 🎉</button>
</div>

<script>
// =====================================================================
// BGO NAV — Professional Navigation App
// =====================================================================

/* ─── State ─── */
let map, userMarker, destMarker, routeLayer;
let userPos = null;
let destPos = null;
let navSteps = [];
let currentStepIdx = 0;
let isNavigating = false;
let watchId = null;
let totalDurationSec = 0;
let totalDistanceM = 0;
let remDurationSec = 0;
let searchTimeout = null;
let destName = '';
let autoCenter = true;
let nightMode = false;
let etaInterval = null;
let navStartTime = null;
let allRoutes = [];
let selectedRouteIdx = 0;
let tileLayer = null;
let camAlertTimer = null;
let lastSpeedMs = 0;
let compassAngle = 0;

/* ─── SVG Arrow Paths ─── */
const ARROWS = {
  straight:    'M18 30 L18 8 M18 8 L10 16 M18 8 L26 16',
  left:        'M28 28 L28 16 Q28 8 20 8 L8 8 M8 8 L16 14 M8 8 L16 2',
  right:       'M8 28 L8 16 Q8 8 16 8 L28 8 M28 8 L20 14 M28 8 L20 2',
  'slight_left':  'M24 28 L24 18 Q24 10 16 10 L10 10 M10 10 L17 6 M10 10 L15 17',
  'slight_right': 'M12 28 L12 18 Q12 10 20 10 L26 10 M26 10 L19 6 M26 10 L21 17',
  'sharp_left':   'M26 28 L26 20 L10 20 L10 10 M10 10 L16 6 M10 10 L4 14',
  'sharp_right':  'M10 28 L10 20 L26 20 L26 10 M26 10 L20 6 M26 10 L32 14',
  uturn:       'M20 30 L20 18 Q20 8 12 8 Q4 8 4 16 Q4 24 12 24 L24 24 M24 24 L18 30 M24 24 L30 30',
  arrive:      null,
  roundabout:  null,
  merge:       'M18 30 L18 8 M18 8 L10 16 M18 8 L26 16',
  fork_right:  'M12 30 L18 18 L24 8 M24 8 L24 16 M24 8 L16 12',
  fork_left:   'M24 30 L18 18 L12 8 M12 8 L12 16 M12 8 L20 12',
};

/* ─── Init ─── */
document.addEventListener('DOMContentLoaded', initApp);

function initApp() {
  initMap();
  initSearch();
  initCompass();
  startGPS();
  // Load search history
  document.getElementById('search-input').addEventListener('focus', showHistory);
}

/* ─── Map ─── */
function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    center: [31.77, 35.21],
    zoom: 13,
    zoomSnap: 0.5,
  });

  tileLayer = L.tileLayer(voyagerUrl(), {
    attribution: '© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
    detectRetina: true,
  }).addTo(map);

  map.zoomControl.setPosition('bottomright');
  map.on('dragstart', () => { autoCenter = false; });
}

function voyagerUrl() {
  return 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
}
function darkUrl() {
  return 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
}

/* ─── Night Mode ─── */
function toggleNight() {
  nightMode = !nightMode;
  document.body.classList.toggle('night', nightMode);
  document.getElementById('night-btn').textContent = nightMode ? '☀️' : '🌙';
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(nightMode ? darkUrl() : voyagerUrl(), {
    attribution: '© OSM © CARTO',
    subdomains: 'abcd', maxZoom: 20, detectRetina: true,
  }).addTo(map);
  tileLayer.bringToBack();
}

/* ─── GPS ─── */
function startGPS() {
  if (!navigator.geolocation) { setGpsStatus(false, 'GPS לא נתמך'); return; }
  watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 20000,
  });
}

function onPosition(pos) {
  const { latitude: lat, longitude: lng, speed, accuracy } = pos.coords;
  userPos = { lat, lng };
  lastSpeedMs = speed || 0;

  setGpsStatus(true, accuracy ? `±${Math.round(accuracy)}מ'` : 'GPS פעיל');

  if (!userMarker) {
    const icon = L.divIcon({
      className: '',
      html: '<div class="blue-dot-outer"><div class="blue-dot-inner"></div></div>',
      iconSize: [26, 26], iconAnchor: [13, 13],
    });
    userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
    if (autoCenter) map.setView([lat, lng], 15);
  } else {
    userMarker.setLatLng([lat, lng]);
    if (autoCenter && !isNavigating) map.panTo([lat, lng]);
    else if (autoCenter && isNavigating) map.panTo([lat, lng]);
  }

  updateSpeedDisplay(lastSpeedMs);

  if (isNavigating && navSteps.length > 0) {
    checkStepAdvance(lat, lng);
    updateRemainingFromGPS(lat, lng);
  }
}

function onGpsError(err) { setGpsStatus(false, 'שגיאת GPS'); }

function setGpsStatus(active, label) {
  document.getElementById('gps-dot').classList.toggle('active', active);
  document.getElementById('gps-label').textContent = label;
}

/* ─── Speed Display ─── */
function updateSpeedDisplay(speedMs) {
  const kmh = speedMs ? Math.round(speedMs * 3.6) : 0;
  document.getElementById('speed-val').textContent = kmh;
  const el = document.getElementById('speed-indicator');
  el.className = '';
  if (kmh > 100) el.classList.add('danger');
  else if (kmh > 75) el.classList.add('warn');
  // Speed camera simulation: random beep at 90kmh+ (real app would use DB)
  if (kmh > 90 && isNavigating) triggerCamAlert(kmh);
}

/* ─── Speed Camera Alert ─── */
let lastCamBeep = 0;
function triggerCamAlert(kmh) {
  const now = Date.now();
  if (now - lastCamBeep < 8000) return; // debounce 8s
  lastCamBeep = now;
  document.getElementById('cam-text').textContent = `מצלמת מהירות! ${kmh} קמ"ש`;
  const cam = document.getElementById('cam-alert');
  cam.classList.add('show');
  playBeep();
  clearTimeout(camAlertTimer);
  camAlertTimer = setTimeout(() => cam.classList.remove('show'), 5000);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

/* ─── Compass ─── */
function initCompass() {
  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+ requires permission — skip auto-start
    } else {
      window.addEventListener('deviceorientation', onOrientation, true);
    }
  }
}
function onOrientation(e) {
  if (e.alpha == null) return;
  compassAngle = Math.round(e.webkitCompassHeading || (360 - e.alpha));
  document.getElementById('compass-arrow').style.transform = `rotate(${compassAngle}deg)`;
}

/* ─── Center ─── */
function centerOnUser() {
  if (userPos) {
    map.flyTo([userPos.lat, userPos.lng], 16, { animate: true, duration: 1 });
    autoCenter = true;
  }
}

/* ─── Search ─── */
function initSearch() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clear.classList.toggle('visible', q.length > 0);
    clearTimeout(searchTimeout);
    if (q.length < 2) { closeAutocomplete(); return; }
    searchTimeout = setTimeout(() => fetchSuggestions(q), 350);
  });

  clear.addEventListener('click', () => {
    input.value = '';
    clear.classList.remove('visible');
    closeAutocomplete();
    input.focus();
  });

  map.on('click', closeAutocomplete);
}

function showHistory() {
  const input = document.getElementById('search-input');
  if (input.value.trim().length > 0) return;
  const history = getHistory();
  if (!history.length) return;
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = '';
  history.slice(0, 5).forEach(item => {
    const div = document.createElement('div');
    div.className = 'ac-item';
    div.innerHTML = `<div class="ac-hist-icon">🕐</div><div class="ac-text"><div class="ac-name">${escHtml(item.name)}</div><div class="ac-addr">${escHtml(item.addr)}</div></div>`;
    div.addEventListener('click', () => selectDestination(item.raw));
    ac.appendChild(div);
  });
  ac.classList.add('open');
}

async function fetchSuggestions(q) {
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = '<div class="ac-loading">מחפש…</div>';
  ac.classList.add('open');
  try {
    const bias = userPos ? `&viewbox=${userPos.lng-0.5},${userPos.lat-0.5},${userPos.lng+0.5},${userPos.lat+0.5}&bounded=0` : '';
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&accept-language=he&addressdetails=1${bias}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'he' } });
    const data = await res.json();

    if (!data.length) { ac.innerHTML = '<div class="ac-loading">לא נמצאו תוצאות</div>'; return; }

    ac.innerHTML = '';
    data.forEach(item => {
      const name = item.namedetails?.name || item.display_name.split(',')[0];
      const addr = item.display_name;
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.innerHTML = `<div class="ac-pin">📍</div><div class="ac-text"><div class="ac-name">${escHtml(name)}</div><div class="ac-addr">${escHtml(addr)}</div></div>`;
      div.addEventListener('click', () => selectDestination(item));
      ac.appendChild(div);
    });
  } catch (e) {
    ac.innerHTML = '<div class="ac-loading">שגיאת חיפוש</div>';
  }
}

function closeAutocomplete() {
  const ac = document.getElementById('autocomplete');
  ac.classList.remove('open');
  ac.innerHTML = '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function selectDestination(item) {
  destName = item.display_name.split(',')[0];
  destPos = { lat: parseFloat(item.lat), lng: parseFloat(item.lon) };

  document.getElementById('search-input').value = destName;
  document.getElementById('search-clear').classList.add('visible');
  closeAutocomplete();

  // Add destination marker (teardrop)
  if (destMarker) map.removeLayer(destMarker);
  const destIcon = L.divIcon({
    className: '',
    html: `<svg width="30" height="40" viewBox="0 0 30 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 0C6.72 0 0 6.72 0 15C0 26.25 15 40 15 40C15 40 30 26.25 30 15C30 6.72 23.28 0 15 0Z" fill="#ef4444"/>
      <circle cx="15" cy="15" r="6" fill="white"/>
    </svg>`,
    iconSize: [30, 40], iconAnchor: [15, 40],
  });
  destMarker = L.marker([destPos.lat, destPos.lng], { icon: destIcon }).addTo(map);

  saveHistory({ name: destName, addr: item.display_name, raw: item });

  if (!userPos) { showToast('ממתין לאיתור GPS…'); return; }
  await fetchRoutes();
}

/* ─── Routing with Alternatives ─── */
async function fetchRoutes() {
  if (!userPos || !destPos) return;
  hideAltBanner();
  showLoading(true);
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${userPos.lng},${userPos.lat};${destPos.lng},${destPos.lat}?steps=true&geometries=geojson&overview=full&alternatives=true`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code !== 'Ok' || !data.routes.length) {
      showToast('לא נמצא מסלול');
      showLoading(false);
      return;
    }

    allRoutes = data.routes;

    if (allRoutes.length > 1) {
      showAltBanner();
    } else {
      applyRoute(0);
    }
  } catch (e) {
    showToast('שגיאת חיבור — בדוק אינטרנט');
  }
  showLoading(false);
}

function showAltBanner() {
  const container = document.getElementById('alt-routes');
  container.innerHTML = '';
  allRoutes.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'alt-card' + (i === 0 ? ' selected' : '');
    card.innerHTML = `<div class="alt-dist">${fmtDist(r.distance)}</div><div class="alt-dur">${fmtDuration(r.duration)}</div><div class="alt-tag">${i === 0 ? '🏆 הכי מהיר' : i === 1 ? '📏 מסלול חלופי' : '🔀 אפשרות נוספת'}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.alt-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedRouteIdx = i;
      drawRoutePreview(i);
    };
    container.appendChild(card);
  });

  // Go button
  const btn = document.createElement('button');
  btn.className = 'alt-go';
  btn.innerHTML = '▶ נווט';
  btn.onclick = () => { hideAltBanner(); applyRoute(selectedRouteIdx); };
  container.appendChild(btn);

  drawRoutePreview(0);
  document.getElementById('alt-banner').classList.add('visible');
}

function hideAltBanner() {
  document.getElementById('alt-banner').classList.remove('visible');
}

function drawRoutePreview(idx) {
  clearRouteLayer();
  const route = allRoutes[idx];
  const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
  const glow = L.polyline(coords, { color: '#3b82f6', weight: 12, opacity: 0.15, lineCap: 'round' }).addTo(map);
  const main = L.polyline(coords, { color: '#3b82f6', weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(map);
  routeLayer = { _glow: glow, _main: main };
  map.fitBounds(L.featureGroup([glow]).getBounds(), { padding: [60, 80] });
}

function applyRoute(idx) {
  clearRouteLayer();
  const route = allRoutes[idx];
  totalDurationSec = route.duration;
  totalDistanceM = route.distance;
  remDurationSec = totalDurationSec;
  navSteps = route.legs[0].steps;
  currentStepIdx = 0;
  drawRoute(route.geometry.coordinates);
  startNavigation();
  updateHUD();
}

function drawRoute(coords) {
  clearRouteLayer();
  const latLngs = coords.map(c => [c[1], c[0]]);
  const glow = L.polyline(latLngs, { color: '#3b82f6', weight: 14, opacity: 0.16, lineCap: 'round', lineJoin: 'round' }).addTo(map);
  const main = L.polyline(latLngs, { color: '#3b82f6', weight: 5.5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(map);
  routeLayer = { _glow: glow, _main: main };
  map.fitBounds(L.featureGroup([glow]).getBounds(), { padding: [60, 60] });
}

function clearRouteLayer() {
  if (routeLayer) {
    if (routeLayer._glow) map.removeLayer(routeLayer._glow);
    if (routeLayer._main) map.removeLayer(routeLayer._main);
    routeLayer = null;
  }
}

function startNavigation() {
  isNavigating = true;
  autoCenter = true;
  navStartTime = Date.now();

  document.getElementById('hud').classList.add('visible');
  document.getElementById('stop-btn').classList.add('visible');
  document.getElementById('recalc-btn').classList.add('visible');
  document.body.classList.add('hud-active');
  document.getElementById('search-panel').classList.add('nav-hidden');

  const dist = fmtDist(totalDistanceM);
  const dur = fmtDuration(totalDurationSec);
  showToast(`מסלול נמצא ✓ ${dist} · ${dur}`);

  // Live ETA countdown every second
  clearInterval(etaInterval);
  etaInterval = setInterval(() => {
    if (!isNavigating) { clearInterval(etaInterval); return; }
    if (remDurationSec > 0) {
      remDurationSec = Math.max(0, remDurationSec - 1);
      document.getElementById('stat-dur').textContent = fmtDuration(remDurationSec);
      document.getElementById('stat-eta').textContent = calcETA(remDurationSec);
    }
  }, 1000);
}

function stopNavigation() {
  isNavigating = false;
  autoCenter = false;
  navSteps = [];
  currentStepIdx = 0;
  clearInterval(etaInterval);
  clearRouteLayer();

  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  destPos = null;

  document.getElementById('hud').classList.remove('visible');
  document.getElementById('stop-btn').classList.remove('visible');
  document.getElementById('recalc-btn').classList.remove('visible');
  document.body.classList.remove('hud-active');
  document.getElementById('search-panel').classList.remove('nav-hidden', 'hidden');
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  hideAltBanner();
}

async function recalcRoute() {
  if (destPos) {
    showToast('מחשב מחדש…');
    await fetchRoutes();
  }
}

/* ─── HUD Update ─── */
function updateHUD() {
  if (!navSteps.length) return;
  const step = navSteps[currentStepIdx];
  const m = step.maneuver || {};

  setArrow(m.type, m.modifier);
  document.getElementById('turn-dist').textContent = fmtDist(step.distance);
  document.getElementById('turn-street').textContent = step.name || hebrewInstruction(step);
  document.getElementById('turn-instruction').textContent = step.name ? hebrewInstruction(step) : '';

  let remDist = 0, remDur = 0;
  for (let i = currentStepIdx; i < navSteps.length; i++) {
    remDist += navSteps[i].distance;
    remDur  += navSteps[i].duration;
  }
  remDurationSec = remDur;

  document.getElementById('stat-remain').textContent = fmtDist(remDist);
  document.getElementById('stat-dur').textContent = fmtDuration(remDur);
  document.getElementById('stat-eta').textContent = calcETA(remDur);

  if (m.type === 'arrive') showArrived();
}

function updateRemainingFromGPS(lat, lng) {
  // Keep distance stat in sync with actual position
  if (!navSteps.length) return;
  let remDist = 0;
  for (let i = currentStepIdx; i < navSteps.length; i++) {
    remDist += navSteps[i].distance;
  }
  // Subtract distance already covered in current step
  const step = navSteps[currentStepIdx];
  const loc = step.maneuver.location;
  const distToManeuver = haversine(lat, lng, loc[1], loc[0]);
  const covered = Math.max(0, step.distance - distToManeuver);
  document.getElementById('stat-remain').textContent = fmtDist(Math.max(0, remDist - covered));
}

/* ─── SVG Turn Arrows ─── */
function setArrow(type, modifier) {
  const svg = document.getElementById('turn-arrow-svg');
  const path = document.getElementById('arrow-path');
  const wrap = document.getElementById('turn-arrow-wrap');

  if (type === 'arrive') {
    svg.innerHTML = '<text x="18" y="26" text-anchor="middle" font-size="28">🏁</text>';
    wrap.style.background = 'rgba(34,197,94,.15)';
    wrap.style.borderColor = 'rgba(34,197,94,.35)';
    return;
  }
  if (type === 'roundabout' || type === 'rotary') {
    svg.innerHTML = `<path d="M24 18 Q24 8 15 8 Q6 8 6 18 Q6 24 10 27 M10 27 L10 20 M10 27 L17 24" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    resetWrapColor();
    return;
  }

  const key = type === 'turn' || type === 'end of road' || type === 'new name'
    ? (modifier || 'straight').replace(' ', '_')
    : type === 'fork'
      ? (modifier && modifier.includes('right') ? 'fork_right' : 'fork_left')
      : 'straight';

  const d = ARROWS[key] || ARROWS.straight;
  svg.innerHTML = `<path d="${d}" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  resetWrapColor();
}

function resetWrapColor() {
  const wrap = document.getElementById('turn-arrow-wrap');
  wrap.style.background = '';
  wrap.style.borderColor = '';
}

/* ─── Step Advance ─── */
function checkStepAdvance(lat, lng) {
  if (currentStepIdx >= navSteps.length - 1) return;
  const step = navSteps[currentStepIdx];
  const loc = step.maneuver.location;
  const dist = haversine(lat, lng, loc[1], loc[0]);
  if (dist < 30) {
    currentStepIdx++;
    updateHUD();
    if (autoCenter && userPos) map.panTo([userPos.lat, userPos.lng]);
  }
}

/* ─── Helpers ─── */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(meters) {
  if (meters < 1000) return `${Math.round(meters)} מ'`;
  return `${(meters/1000).toFixed(1)} ק"מ`;
}

function fmtDuration(sec) {
  if (sec < 60) return 'פחות מדקה';
  const m = Math.round(sec / 60);
  if (m < 60) return `${m} דק'`;
  const h = Math.floor(m / 60), rm = m % 60;
  return `${h}ש' ${rm > 0 ? rm+"ד'" : ''}`;
}

function calcETA(durationSeconds) {
  const eta = new Date(Date.now() + durationSeconds * 1000);
  return eta.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function hebrewInstruction(step) {
  const t = step.maneuver.type;
  const m = step.maneuver.modifier || '';
  const name = step.name || '';

  if (t === 'turn') {
    if (m === 'uturn') return 'בצע פניית פרסה';
    if (m === 'sharp right') return `פנה חדה ימינה${name ? ' לכיוון '+name : ''}`;
    if (m === 'sharp left')  return `פנה חדה שמאלה${name ? ' לכיוון '+name : ''}`;
    if (m === 'slight right') return `סע מעט ימינה${name ? ' לכיוון '+name : ''}`;
    if (m === 'slight left')  return `סע מעט שמאלה${name ? ' לכיוון '+name : ''}`;
    if (m.includes('right'))  return `פנה ימינה${name ? ' לכיוון '+name : ''}`;
    if (m.includes('left'))   return `פנה שמאלה${name ? ' לכיוון '+name : ''}`;
    return `המשך ישר${name ? ' ב'+name : ''}`;
  }
  if (t === 'arrive')     return '🏁 הגעת ליעד';
  if (t === 'depart')     return name ? `התחל ב-${name}` : 'צא לדרך';
  if (t === 'roundabout' || t === 'rotary') return `כנס לכיכר${name ? ' — '+name : ''}`;
  if (t === 'merge')      return name ? `מזג אל ${name}` : 'מזג תנועה';
  if (t === 'on ramp')    return name ? `עלה לכביש ${name}` : 'עלה לכניסה';
  if (t === 'off ramp')   return name ? `רד ל-${name}` : 'צא מהכניסה';
  if (t === 'fork') {
    if (m.includes('right')) return name ? `קח ימינה אל ${name}` : 'קח ימינה בפיצול';
    if (m.includes('left'))  return name ? `קח שמאלה אל ${name}` : 'קח שמאלה בפיצול';
  }
  return name ? `המשך ב-${name}` : 'המשך ישר';
}

/* ─── Toast ─── */
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

/* ─── Loading ─── */
function showLoading(show) {
  document.getElementById('route-loading').classList.toggle('show', show);
}

/* ─── Arrived + Confetti ─── */
function showArrived() {
  document.getElementById('arrived-dest').textContent = destName;
  document.getElementById('arrived-overlay').classList.add('show');
  launchConfetti();
}

function closeArrived() {
  document.getElementById('arrived-overlay').classList.remove('show');
  stopNavigation();
}

function launchConfetti() {
  const wrap = document.getElementById('confetti-wrap');
  wrap.innerHTML = '';
  const colors = ['#06b6d4','#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#fff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetto';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (Math.random() * 8 + 5) + 'px';
    c.style.height = (Math.random() * 8 + 5) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const delay = Math.random() * 0.8;
    const dur = 1.5 + Math.random() * 2;
    c.style.animation = `confettiFall ${dur}s ease-in ${delay}s forwards`;
    wrap.appendChild(c);
  }
}

/* ─── Search History ─── */
function getHistory() {
  try { return JSON.parse(localStorage.getItem('bgo_nav_history') || '[]'); }
  catch(e) { return []; }
}

function saveHistory(item) {
  try {
    let h = getHistory().filter(x => x.name !== item.name);
    h.unshift(item);
    h = h.slice(0, 10);
    localStorage.setItem('bgo_nav_history', JSON.stringify(h));
  } catch(e) {}
}

/* ─── Recalc alias ─── */
async function calcRoute() { await fetchRoutes(); }
